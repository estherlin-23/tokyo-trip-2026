<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <!-- 加入手機主畫面後，像 App 一樣全螢幕開啟 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="旅行手帳">
    <meta name="application-name" content="旅行手帳">
    <meta name="theme-color" content="#F4F6F8">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <title>日式極簡旅遊 App</title>
    
    <!-- 載入核心套件 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.global.prod.js"></script>
    <!-- 圖示與字體 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
    <!-- 拖曳排序套件 -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
    <!-- 圓餅圖套件 -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    <!-- 開源地圖 Leaflet 套件 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
    <script>if (typeof L === 'undefined') document.write('<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"><script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"><\/script>');</script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { light: '#E2E8F0', DEFAULT: '#7E93A3', dark: '#5A7184' },
                        spot: { food: '#87ceeb', spot: '#256694', transit: '#6E99B5', hotel: '#1A7DA1', shopping: '#8ABAD4' },
                        paper: '#F8FAFC',
                    },
                    fontFamily: {
                        sans: ['"Noto Sans TC"', '"M PLUS Rounded 1c"', 'sans-serif'],
                        serif: ['"Playfair Display"', '"Noto Serif TC"', 'serif'],
                    }
                }
            }
        }
    </script>
    <style>
        html, body { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; }
        body { background-color: #E2E8F0; -webkit-tap-highlight-color: transparent; }
        /* 手機：整個背景與 App 同色，上方狀態列區域不會出現一條色差 */
        @media (max-width: 500px) {
            html, body { background-color: #F4F6F8; }
            .app-container { box-shadow: none !important; }
        }
        /* 點兩下不放大 */
        button, a, label, input, select, textarea, .draggable-card { touch-action: manipulation; }

        /* 自訂日期欄位（覆蓋原生日期輸入，iPhone 上不會跑版） */
        .date-field { position: relative; display: flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; overflow: hidden; }
        .date-field input[type=date] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; -webkit-appearance: none; appearance: none; cursor: pointer; font-size: 16px; }

        /* 登機證：以原圖為底，文字依票面比例縮放 */
        .bp2 { position: relative; width: 100%; aspect-ratio: 1724 / 794; container-type: inline-size; user-select: none; -webkit-user-select: none; }
        .bp2-bg { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 2px 3px rgba(15,23,42,.08)) drop-shadow(0 10px 18px rgba(15,23,42,.10)); pointer-events: none; }
        .bp2-t { position: absolute; white-space: nowrap; line-height: 1; overflow: hidden; text-overflow: ellipsis; padding: .15em 0; transform: translateY(-.15em); }
        .bp2-serif { font-family: "Playfair Display", "Noto Serif TC", serif; }
        .bp2-sans { font-family: "Noto Sans TC", sans-serif; }

        #app .todo-item:last-child { border-bottom-color: #F1F5F9; }

        /* 現在時間紅點 */
        @keyframes now-pulse { 0% { box-shadow: 0 0 0 0 rgba(158,14,38,.45); } 70% { box-shadow: 0 0 0 6px rgba(158,14,38,0); } 100% { box-shadow: 0 0 0 0 rgba(158,14,38,0); } }
        .now-pulse { animation: now-pulse 2s infinite; }

        /* 機票翻面 */
        .ticket-flip { perspective: 1400px; }
        .ticket-flip-inner { display: grid; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.3, 0.1, 0.2, 1); }
        .ticket-flip-inner.is-flipped { transform: rotateY(180deg); }
        .ticket-face { grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
        .ticket-face-back { transform: rotateY(180deg); }

        /* 置中彈出視窗 */
        @keyframes pop-in { from { opacity: 0; transform: translateY(8px) scale(0.97); } to { opacity: 1; transform: translateY(0) scale(1); } }
        .animate-pop-in { animation: pop-in 0.22s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .app-container { max-width: 430px; margin: 0 auto; background-color: #F4F6F8; min-height: 100vh; position: relative; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); overflow-x: hidden; }
        .glass-header { background: rgba(244, 246, 248, 0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid rgba(0,0,0,0.05); }
        .glass-nav { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-top: 1px solid #E2E8F0; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tag-outline { color: #64748B; background-color: transparent; border: 1px solid #CBD5E1; padding: 3px 8px; border-radius: 6px; font-weight: 700; font-size: 0.75rem; margin: 0 6px 6px 0; display: inline-flex; align-items: center; transition: transform 0.1s; }
        .inline-edit-input { background: transparent; border: 1px solid transparent; outline: none; width: 100%; transition: all 0.2s; cursor: pointer; }
        .inline-edit-input:focus { background: #F1F5F9; border-bottom: 1px solid #94A3B8; border-radius: 4px; padding-left: 4px; cursor: text; }
        
        .draggable-item { cursor: grab; }
        .draggable-item:active { cursor: grabbing; }
        .sortable-ghost { opacity: 0.35; }
        .sortable-ghost .draggable-card { background-color: #f1f5f9; border-style: dashed; border-color: #94a3b8; box-shadow: none; }
        .sortable-chosen .draggable-card { transform: scale(1.02); box-shadow: 0 12px 24px -8px rgba(15, 23, 42, 0.25); }
        /* 拖曳中的浮動卡片：關掉 transition，才能緊跟手指不延遲 */
        .sortable-fallback, .sortable-drag, .sortable-fallback *, .sortable-drag * { transition: none !important; animation: none !important; }
        .sortable-fallback { opacity: 0.95 !important; z-index: 9999 !important; pointer-events: none; }
        .spot-list-dragging .draggable-card { cursor: grabbing; }
        
        .photo-gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; }
        .photo-gallery img { scroll-snap-align: start; flex-shrink: 0; width: 100%; height: 100%; object-fit: cover; }

        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .animate-slide-up { animation: slide-up 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 20px); }
        .pt-safe { padding-top: env(safe-area-inset-top, 20px); }
        .pt-safe-8 { padding-top: calc(env(safe-area-inset-top, 0px) + 2rem); }
        
        /* Checkbox styling */
        .todo-checkbox { appearance: none; width: 16px; height: 16px; border: 2px solid #CBD5E1; border-radius: 4px; outline: none; cursor: pointer; transition: all 0.2s; position: relative; display: flex; align-items: center; justify-content: center; }
        .todo-checkbox:checked { background-color: #334155; border-color: #334155; }
        .todo-checkbox:checked::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: white; font-size: 9px; }
        
        /* Leaflet custom map popups & markers */
        .leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .leaflet-popup-content { font-family: 'Noto Sans TC', sans-serif; font-weight: bold; font-size: 13px; margin: 10px 14px; }
        .leaflet-custom-marker { background: none; border: none; }
        .leaflet-marker-icon { background: none; border: none; }
    </style>
    <style id="theme-style"></style>
</head>
<body>
    <div id="app"></div>

    <template id="app-template">
        <div class="app-container flex flex-col h-screen overflow-hidden">
            
            <!-- ================= 狀態 1：初始設定頁面 ================= -->
            <div v-if="appState === 'setup'" class="absolute inset-0 bg-[#F4F6F8] z-[100] overflow-y-auto pb-safe overflow-x-hidden hide-scrollbar">
                <div class="min-h-full flex flex-col px-5 pb-8 pt-safe-8 animate-fade-in">
                    <div class="mb-5 mt-2 text-center shrink-0">
                        <div v-if="isEditing" class="text-left mb-3"><button type="button" @click="cancelEdit" class="h-9 px-3 rounded-full bg-white border border-slate-200 text-[12px] font-bold text-slate-500 shadow-sm active:scale-95"><i class="fa-solid fa-chevron-left mr-1"></i>返回（不儲存）</button></div>
                        <h1 class="text-[28px] font-serif font-bold text-[#1e293b] mb-2 tracking-widest">{{ isEditing ? '修改旅程設定' : '拉開旅程的序幕' }}</h1>
                        <p class="text-[#64748B] text-[13px] leading-relaxed tracking-wider font-serif">每趟未知的探索，都值得被好好期待。<br>寫下時間與目的地，為專屬回憶命名。</p>
                    </div>
                    
                    <!-- 旅程基本資料 -->
                    <div class="bg-white rounded-[20px] p-5 shadow-sm border border-slate-100 max-w-[400px] mx-auto w-full mb-4 shrink-0">
                        <p class="text-[11px] font-bold text-slate-700 mb-3 flex items-center"><i class="fa-solid fa-suitcase-rolling mr-1.5 text-[#256694]"></i>旅程</p>
                        <div class="mb-3.5">
                            <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">旅程名稱</label>
                            <input type="text" v-model="tripInfo.tripName" placeholder="例如：東京自由行" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-sm font-bold text-[#1e293b] outline-none focus:border-brand">
                        </div>
                        <div class="grid grid-cols-4 gap-2 mb-3.5">
                            <div>
                                <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">國家</label>
                                <input type="text" v-model="tripInfo.country" placeholder="日本" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-2 text-xs font-bold text-[#1e293b] outline-none focus:border-brand text-center">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">城市</label>
                                <input type="text" v-model="tripInfo.destination" placeholder="東京" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-2 text-xs font-bold text-[#1e293b] outline-none focus:border-brand text-center">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">英文國家</label>
                                <input type="text" v-model="tripInfo.countryEN" placeholder="JAPAN" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-1 py-2 text-xs font-bold text-[#1e293b] outline-none focus:border-brand uppercase text-center">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">英文城市</label>
                                <input type="text" v-model="tripInfo.destinationEN" placeholder="TOKYO" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-1 py-2 text-xs font-bold text-[#1e293b] outline-none focus:border-brand uppercase text-center">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2 mb-3.5">
                            <div>
                                <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">出發日期</label>
                                <date-field v-model="tripInfo.startDate" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 h-[38px] text-[13px] font-bold"></date-field>
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">回程日期</label>
                                <date-field v-model="tripInfo.endDate" :min="tripInfo.startDate" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 h-[38px] text-[13px] font-bold"></date-field>
                            </div>
                        </div>
                        <div>
                            <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">旅客姓名（護照英文）</label>
                            <input type="text" v-model="tripInfo.passengerName" placeholder="ESTHER LIN" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-bold text-[#1e293b] outline-none focus:border-brand uppercase">
                        </div>
                    </div>

                    <!-- 航班資訊：去程 / 回程 -->
                    <div class="bg-white rounded-[20px] p-5 shadow-sm border border-slate-100 max-w-[400px] mx-auto w-full mb-5 shrink-0" v-if="tripInfo.flights && tripInfo.flights.length === 2">
                        <div class="flex items-center justify-between mb-3">
                            <p class="text-[11px] font-bold text-slate-700 flex items-center"><i class="fa-solid fa-plane mr-1.5 text-[#256694]"></i>機票</p>
                            <div class="flex bg-slate-100 rounded-lg p-0.5">
                                <button type="button" @click="flightTab = 0" class="px-3.5 py-1 rounded-md text-[11px] font-bold transition-colors" :class="flightTab === 0 ? 'bg-white text-[#1E4E79] shadow-sm' : 'text-slate-400'">去程</button>
                                <button type="button" @click="flightTab = 1" class="px-3.5 py-1 rounded-md text-[11px] font-bold transition-colors" :class="flightTab === 1 ? 'bg-white text-[#1E4E79] shadow-sm' : 'text-slate-400'">回程</button>
                            </div>
                        </div>
                        <template v-for="(fl, fIdx) in tripInfo.flights" :key="'fl'+fIdx">
                            <div v-show="flightTab === fIdx" class="space-y-3">
                                <div class="grid grid-cols-5 gap-2">
                                    <div class="col-span-3">
                                        <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">航空公司</label>
                                        <input type="text" v-model="fl.airline" list="airline-list" placeholder="例：中華航空" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 text-xs font-bold text-[#1e293b] outline-none focus:border-brand">
                                    </div>
                                    <div class="col-span-2">
                                        <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">航班編號</label>
                                        <input type="text" v-model="fl.flightNo" placeholder="CI100" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 py-2 text-xs font-bold text-[#1e293b] outline-none focus:border-brand uppercase text-center font-sans">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">飛行日期</label>
                                    <date-field v-model="fl.date" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-2 h-[36px] text-[12px] font-bold"></date-field>
                                </div>
                                <!-- 出發 → 抵達 -->
                                <div class="rounded-xl border border-slate-200 overflow-hidden">
                                    <div class="grid grid-cols-[52px_1fr_1fr_1fr] items-center bg-slate-50 text-[9px] font-bold text-[#94a3b8] tracking-widest px-2 py-1.5 gap-1.5">
                                        <span></span><span class="text-center">機場代碼</span><span class="text-center">時間</span><span class="text-center">航廈</span>
                                    </div>
                                    <div class="grid grid-cols-[52px_1fr_1fr_1fr] items-center px-2 py-1.5 gap-1.5 border-t border-slate-100">
                                        <span class="text-[11px] font-bold text-slate-600"><i class="fa-solid fa-plane-departure text-[#256694] mr-1 text-[10px]"></i>出發</span>
                                        <input type="text" v-model="fl.depCode" maxlength="3" placeholder="TPE" class="w-full min-w-0 bg-white border border-slate-200 rounded-md px-1 py-1.5 text-xs font-bold text-center uppercase outline-none focus:border-brand font-sans">
                                        <input type="text" inputmode="numeric" maxlength="5" placeholder="08:50" autocomplete="off" :value="fl.depTime" @input="fl.depTime = formatTimeTyping($event.target.value); $event.target.value = fl.depTime" @blur="fl.depTime = normalizeTime(fl.depTime)" class="w-full min-w-0 bg-white border border-slate-200 rounded-md px-1 py-1.5 text-xs font-bold text-center outline-none focus:border-brand font-sans placeholder:text-slate-300 placeholder:font-normal">
                                        <input type="text" v-model="fl.depTerminal" placeholder="1" class="w-full min-w-0 bg-white border border-slate-200 rounded-md px-1 py-1.5 text-xs font-bold text-center uppercase outline-none focus:border-brand font-sans">
                                    </div>
                                    <div class="grid grid-cols-[52px_1fr_1fr_1fr] items-center px-2 py-1.5 gap-1.5 border-t border-slate-100">
                                        <span class="text-[11px] font-bold text-slate-600"><i class="fa-solid fa-plane-arrival text-[#256694] mr-1 text-[10px]"></i>抵達</span>
                                        <input type="text" v-model="fl.arrCode" maxlength="3" placeholder="NRT" class="w-full min-w-0 bg-white border border-slate-200 rounded-md px-1 py-1.5 text-xs font-bold text-center uppercase outline-none focus:border-brand font-sans">
                                        <input type="text" inputmode="numeric" maxlength="5" placeholder="13:05" autocomplete="off" :value="fl.arrTime" @input="fl.arrTime = formatTimeTyping($event.target.value); $event.target.value = fl.arrTime" @blur="fl.arrTime = normalizeTime(fl.arrTime)" class="w-full min-w-0 bg-white border border-slate-200 rounded-md px-1 py-1.5 text-xs font-bold text-center outline-none focus:border-brand font-sans placeholder:text-slate-300 placeholder:font-normal">
                                        <input type="text" v-model="fl.arrTerminal" placeholder="2" class="w-full min-w-0 bg-white border border-slate-200 rounded-md px-1 py-1.5 text-xs font-bold text-center uppercase outline-none focus:border-brand font-sans">
                                    </div>
                                </div>
                                <div class="grid grid-cols-3 gap-2">
                                    <div>
                                        <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">登機時間</label>
                                        <input type="text" inputmode="numeric" maxlength="5" placeholder="08:10" autocomplete="off" :value="fl.boardingTime" @input="fl.boardingTime = formatTimeTyping($event.target.value); $event.target.value = fl.boardingTime" @blur="fl.boardingTime = normalizeTime(fl.boardingTime)" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-1 py-2 text-xs font-bold text-center outline-none focus:border-brand font-sans placeholder:text-slate-300 placeholder:font-normal">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">登機門</label>
                                        <input type="text" v-model="fl.gate" placeholder="B7" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-1 py-2 text-xs font-bold text-center uppercase outline-none focus:border-brand font-sans">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">座位</label>
                                        <input type="text" v-model="fl.seat" placeholder="23C" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-1 py-2 text-xs font-bold text-center uppercase outline-none focus:border-brand font-sans">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">艙等</label>
                                        <input type="text" v-model="fl.cabin" list="cabin-list" placeholder="經濟艙" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-1 py-2 text-xs font-bold text-center outline-none focus:border-brand">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">行李</label>
                                        <input type="text" v-model="fl.baggage" placeholder="23kg" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-1 py-2 text-xs font-bold text-center outline-none focus:border-brand font-sans">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-bold text-[#94a3b8] mb-1 tracking-widest">訂位代號</label>
                                        <input type="text" v-model="fl.bookingRef" placeholder="ABC123" class="w-full bg-slate-50 border border-slate-200 rounded-lg px-1 py-2 text-xs font-bold text-center uppercase outline-none focus:border-brand font-sans">
                                    </div>
                                </div>
                                <button v-if="fIdx === 1" type="button" @click="fillReturnFromOutbound" class="w-full text-[11px] font-bold text-[#1A5F8A] bg-[#EAF3F9] border border-[#9CC3DD] rounded-lg py-2 active:scale-[0.98]">
                                    <i class="fa-solid fa-right-left mr-1.5"></i>從去程帶入（機場對調、同航空公司與訂位代號）
                                </button>
                            </div>
                        </template>
                        <datalist id="airline-list">
                            <option value="中華航空"></option><option value="長榮航空"></option><option value="星宇航空"></option><option value="國泰航空"></option>
                            <option value="台灣虎航"></option><option value="樂桃航空"></option><option value="捷星日本"></option><option value="日本航空"></option><option value="全日空"></option>
                        </datalist>
                        <datalist id="cabin-list">
                            <option value="經濟艙"></option><option value="豪華經濟艙"></option><option value="商務艙"></option><option value="頭等艙"></option>
                        </datalist>
                    </div>

                    <!-- 登機證預覽（點一下切換去程/回程） -->
                    <div v-if="tripInfo.flights && tripInfo.flights.length === 2" class="max-w-[400px] mx-auto w-full shrink-0">
                        <div class="ticket-flip cursor-pointer select-none" @click="flightTab = flightTab === 0 ? 1 : 0">
                            <div class="ticket-flip-inner" :class="{ 'is-flipped': flightTab === 1 }">
                                <div class="ticket-face"><boarding-pass :flight="tripInfo.flights[0]" dir="out" :passenger="tripInfo.passengerName" :year="startYear"></boarding-pass></div>
                                <div class="ticket-face ticket-face-back"><boarding-pass :flight="tripInfo.flights[1]" dir="back" :passenger="tripInfo.passengerName" :year="endYear"></boarding-pass></div>
                            </div>
                        </div>
                        <p class="text-center text-[10px] font-bold text-slate-400 mt-2"><i class="fa-solid fa-hand-pointer mr-1"></i>點機票可切換去程 / 回程</p>
                    </div>
                    
                    <div class="flex-grow"></div>
                    <div class="max-w-[400px] mx-auto w-full pt-8 pb-4 shrink-0">
                        <button type="button" @click="startJourney" class="w-full bg-[#1e293b] text-white font-bold tracking-widest py-3.5 rounded-xl shadow-lg active:scale-[0.98] transition-transform flex items-center justify-center space-x-2 font-serif text-sm">
                            <span>{{ isEditing ? '儲存修改' : '啟程・建立行程表' }}</span>
                            <i class="fa-solid fa-arrow-right text-xs"></i>
                        </button>
                        <label v-if="!isEditing" class="mt-4 flex items-center justify-center text-[12px] font-bold text-[#1A5F8A] cursor-pointer">
                            <i class="fa-solid fa-file-arrow-up mr-1.5"></i> 已經有備份檔？點這裡匯入
                            <input type="file" @change="importBackupJSON" class="hidden">
                        </label>
                    </div>
                </div>
            </div>

            <!-- ================= 狀態 2：主應用程式畫面 ================= -->
            <template v-if="appState === 'main'">
                
                <header class="glass-header fixed top-0 w-full max-w-[430px] z-30 pt-safe h-[76px] px-5 flex justify-between items-center">
                    <div @click="openEdit" class="flex-1 cursor-pointer group">
                        <h1 class="text-xl font-bold text-slate-800 tracking-wide flex items-center font-serif transition-colors">
                            {{ tripInfo.tripName || tripInfo.destination + '自由行' }}
                            <i class="fa-solid fa-pen text-[10px] text-slate-300 ml-2 group-hover:text-slate-500 transition-colors"></i>
                            <i v-if="sync.enabled" class="fa-solid text-[11px] ml-2" :class="sync.status === 'error' ? 'fa-triangle-exclamation text-red-400' : 'fa-cloud text-slate-300'" :title="syncStatusText"></i>
                        </h1>
                        <p class="text-[11px] text-slate-500 font-bold mt-1 transition-colors">
                            {{ startYear }}.{{ tripInfo.startDate.substring(5).replace('-', '.') }} - {{ tripInfo.endDate.substring(5).replace('-', '.') }} 
                            ({{ calculatedDays }} Days)
                        </p>
                    </div>
                    <button type="button" v-if="currentTab === 'itinerary'" @click="openAddSpot" class="w-9 h-9 bg-slate-800 text-white rounded-full flex items-center justify-center shadow-md active:scale-95 transition-transform ml-4 shrink-0">
                        <i class="fa-solid fa-plus text-sm"></i>
                    </button>
                </header>

                <main id="main-scroll" class="flex-1 overflow-y-auto overflow-x-hidden hide-scrollbar pt-[76px] relative bg-[#F4F6F8]" style="padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px));">
                    
                    <!-- Tab 1: 行程 (Itinerary) -->
                    <div v-show="currentTab === 'itinerary'" class="animate-fade-in relative min-h-full">
                        
                        <!-- 釘選導航 -->
                        <div class="sticky top-0 z-20 bg-white border-b border-slate-200 shadow-[0_5px_10px_-10px_rgba(0,0,0,0.05)] flex items-center px-1 w-full max-w-full">
                            <div class="flex-1 flex overflow-x-auto hide-scrollbar items-end pt-2 pb-2 snap-x">
                                <div v-for="(day, index) in itinerary" :key="index" @click="activeDay = index" class="flex flex-col items-center justify-center w-[16.66666%] min-w-[50px] max-w-[55px] cursor-pointer group shrink-0 snap-start">
                                    <span class="text-[9px] font-bold tracking-widest mb-1 transition-colors uppercase" :class="activeDay === index ? 'text-slate-800' : 'text-slate-400 group-hover:text-slate-600'">
                                        {{ day.label.replace('Day', 'DAY') }}
                                    </span>
                                    <span class="text-[22px] font-serif leading-none transition-colors" :class="activeDay === index ? 'text-slate-900 font-bold' : 'text-slate-400 group-hover:text-slate-600'">
                                        {{ day.dayNum }}
                                    </span>
                                    <div class="w-1 h-1 rounded-full mt-1.5 transition-colors" :class="activeDay === index ? 'bg-red-500' : 'bg-transparent'"></div>
                                </div>
                            </div>
                        </div>

                        <div v-if="itinerary[activeDay]">
                            <div class="flex px-4 mt-5 mb-6 pb-2">
                                <div class="w-14 flex flex-col items-center justify-start pt-2 shrink-0 mr-1">
                                    <span class="text-[11px] font-bold text-slate-400 mb-1 uppercase tracking-widest">{{ itinerary[activeDay].dayOfWeekEN }}</span>
                                    <span class="text-lg font-bold text-slate-700 font-serif">{{ itinerary[activeDay].shortDate }}</span>
                                </div>
                                <div class="flex-1 relative rounded-xl overflow-hidden shadow-sm h-44 bg-slate-200 cursor-pointer group" @click="openEditHeroModal">
                                    <img :src="itinerary[activeDay].hero.image" :style="{ objectPosition: '50% ' + (itinerary[activeDay].hero.position || 50) + '%' }" class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                                    <div class="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent"></div>
                                    <div class="absolute bottom-3 left-4 right-4 text-white">
                                        <div class="flex items-center space-x-2 text-[9px] mb-1.5 opacity-90 tracking-widest">
                                            <span class="border border-white/40 px-1.5 py-0.5 rounded uppercase">{{ itinerary[activeDay].label }}</span>
                                            <span><i class="fa-solid fa-location-dot mr-1"></i>{{ itinerary[activeDay].hero.location }}</span>
                                        </div>
                                        <h2 class="text-lg font-bold tracking-wide shadow-sm font-serif">{{ itinerary[activeDay].hero.title }}</h2>
                                    </div>
                                </div>
                            </div>

                            <!-- 完美時間軸佈局 (支援拖曳排序) -->
                            <div class="px-3 pb-10">
                                <div class="flex justify-between items-center mb-4 pl-[50px]">
                                    <span class="text-xs font-bold text-slate-400"><i class="fa-solid fa-hand-pointer mr-1"></i> 長按卡片即可拖曳排序</span>
                                    <div class="flex items-center gap-1.5">
                                        <button type="button" v-if="hasCustomOrder(activeDay)" @click="autoSortCurrentDay" class="text-[10px] font-bold text-brand bg-slate-50 px-2 py-1 rounded border border-slate-200 shadow-sm active:scale-95 flex items-center">
                                            <i class="fa-solid fa-arrow-down-short-wide mr-1"></i> 按時間排序
                                        </button>
                                        <button type="button" v-if="itinerary.length > 1" @click="showSwapModal = true" class="text-[10px] font-bold text-[#1A5F8A] bg-[#EAF3F9] px-2 py-1 rounded border border-[#9CC3DD] shadow-sm active:scale-95 flex items-center">
                                            <i class="fa-solid fa-right-left mr-1"></i> 整天對調
                                        </button>
                                    </div>
                                </div>
                                
                                <div v-if="itinerary[activeDay].spots.length > 0" class="relative">
                                    <!-- 獨立的引導線 -->
                                    <div class="absolute top-2 bottom-0 left-[49px] w-[2px] bg-slate-200 z-0"></div>
                                    
                                    <div :id="'sortable-list-' + activeDay" class="flex flex-col gap-6 relative z-10" :class="{ 'spot-list-dragging': isDraggingSpot }">
                                        <div v-for="(spot, index) in itinerary[activeDay].spots" :key="spot.id" :data-id="spot.id" class="relative flex items-start group spot-item">
                                            
                                            <!-- 左側：獨立的時間文字區塊 -->
                                            <div class="w-[42px] shrink-0 pt-1 flex flex-col items-end pointer-events-none">
                                                <span class="text-[13px] font-bold text-slate-800 font-sans tracking-tight leading-none mb-1 whitespace-nowrap">
                                                    {{ getTimelineMainText(spot) }}
                                                </span>
                                                <span v-if="getDurationDisplay(spot)" class="text-[9px] font-bold text-slate-400 font-sans text-right leading-tight mt-1">
                                                    {{ getDurationDisplay(spot) }}
                                                </span>
                                            </div>

                                            <!-- 中間：圓點 (對齊引導線) -->
                                            <div class="absolute left-[49px] top-1.5 z-10 w-0.5 h-0.5 flex justify-center items-center pointer-events-none">
                                                <div class="w-3 h-3 rounded-full border-2 border-white shadow-sm ring-1 ring-slate-100 absolute shrink-0" :style="{ backgroundColor: getSpotColor(spot.type) }"></div>
                                            </div>
                                            
                                            <!-- 右側：行程卡片 -->
                                            <div @click="handleCardClick(index, $event)" 
                                                 class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-100 border-l-[3px] ml-[18px] flex-1 relative overflow-hidden cursor-pointer transition-[transform,box-shadow] duration-150 select-none draggable-card"
                                                 :style="{ borderLeftColor: getSpotColor(spot.type) }">
                                                
                                                <!-- 封面照片（放在卡片最上方） -->
                                                <div v-if="spot.coverImage" class="-mx-3 -mt-3 sm:-mx-4 sm:-mt-4 mb-3 relative h-36 overflow-hidden">
                                                    <img :src="spot.coverImage" :style="{ objectPosition: '50% ' + getCoverPos(spot) + '%' }" class="w-full h-full object-cover">
                                                    <div v-if="spot.photoSpotDesc" class="absolute bottom-0 left-0 right-0 bg-gradient-to-t from-black/70 via-black/30 to-transparent px-3 pb-2 pt-6 text-white text-[10px] font-bold flex items-start">
                                                        <i class="fa-solid fa-camera mr-1.5 mt-0.5 opacity-80"></i><span class="leading-relaxed line-clamp-2">{{ getPhotoDescForCover(spot) || spot.photoSpotDesc }}</span>
                                                    </div>
                                                </div>

                                                <!-- 類別＋標題 -->
                                                <div class="mb-1">
                                                    <span class="inline-block px-1.5 py-[3px] rounded-[5px] text-[10px] font-bold leading-none tracking-wide" :style="typeChipStyle(spot.type)">{{ getSpotTypeName(spot.type) }}</span>
                                                </div>
                                                <h3 class="font-bold text-slate-800 text-[16px] leading-snug">{{ spot.name }}</h3>

                                                <!-- 地點・時間・花費（一行精簡） -->
                                                <div v-if="(spot.location && spot.type !== 'transit') || (spot.hours && spot.type !== 'hotel' && spot.type !== 'transit') || (spot.cost && spot.cost > 0)" class="flex flex-wrap items-center gap-x-3 gap-y-1 mt-1.5 mb-1 text-[11px] font-bold text-slate-500">
                                                    <span v-if="spot.location && spot.type !== 'transit'" class="inline-flex items-center min-w-0 max-w-full"><i class="fa-solid fa-location-dot text-[10px] text-slate-300 mr-1"></i><span class="truncate">{{ spot.location }}</span></span>
                                                    <span v-if="spot.hours && spot.type !== 'hotel' && spot.type !== 'transit'" class="inline-flex items-center font-sans"><i class="fa-regular fa-clock text-[10px] text-slate-300 mr-1"></i>{{ spot.hours }}</span>
                                                    <span v-if="spot.cost && spot.cost > 0" class="inline-flex items-center font-sans"><i class="fa-solid fa-wallet text-[10px] text-slate-300 mr-1"></i><span class="text-slate-600">{{ costMain(spot) }}</span><span v-if="costSub(spot)" class="text-slate-400 ml-1 font-normal">{{ costSub(spot) }}</span></span>
                                                    <span v-if="spot.isAdvance && spot.advances && spot.advances.length" class="inline-flex items-center text-[10px] px-1.5 py-[2px] rounded" :style="{ backgroundColor: currentTheme.soft, color: currentTheme.text }"><i class="fa-solid fa-hand-holding-dollar mr-1"></i>{{ spot.payer }} 墊付</span>
                                                </div>
                                                <div class="h-1"></div>

                                                <!-- 航班（精簡版） -->
                                                <div v-if="spot.type === 'transit' && spot.transitMethod === '飛機' && (spot.depAirport || spot.arrAirport)" class="mb-2 mt-1 flex items-center text-[12px] font-bold text-slate-700">
                                                    <span v-if="spot.flightNo" class="font-sans text-[10px] text-slate-500 bg-slate-50 border border-slate-200 rounded px-1.5 py-[1px] mr-2 shrink-0">{{ spot.flightNo.toUpperCase() }}</span>
                                                    <span class="font-sans shrink-0">{{ (spot.depAirport || '').toUpperCase() }}</span>
                                                    <span class="flex-1 flex items-center mx-2 min-w-[40px]">
                                                        <span class="flex-1 h-px bg-slate-200"></span>
                                                        <span v-if="flightDurationShort(spot)" class="px-1.5 text-[10px] text-slate-400 font-sans whitespace-nowrap">{{ flightDurationShort(spot) }}</span>
                                                        <span class="flex-1 h-px bg-slate-200"></span>
                                                        <i class="fa-solid fa-plane text-[9px] text-slate-300 ml-0.5"></i>
                                                    </span>
                                                    <span class="font-sans shrink-0">{{ (spot.arrAirport || '').toUpperCase() }}</span>
                                                </div>
                                                <!-- 交通路線 -->
                                                <div v-else-if="spot.type === 'transit' && transitLegs(spot).length" class="mb-2 mt-1 flex flex-wrap items-center gap-y-1.5 text-[11px] font-bold text-slate-700">
                                                    <template v-for="(leg, li) in transitLegs(spot)" :key="'cl'+li">
                                                        <span v-if="li === 0">{{ leg.from || '出發' }}</span>
                                                        <span class="inline-flex items-center mx-1.5 px-1.5 py-[2px] rounded bg-slate-50 border border-slate-200 text-[10px] text-slate-600">
                                                            <span v-if="leg.line" class="w-1.5 h-1.5 rounded-full mr-1 shrink-0" :style="{ backgroundColor: lineColor(leg.line) }"></span>
                                                            <i v-else :class="'fa-solid ' + transitIcon(spot.transitMethod) + ' mr-1 text-slate-400 text-[9px]'"></i>
                                                            {{ leg.line || (spot.transitMethod === '飛機' && spot.flightNo ? spot.flightNo : spot.transitMethod) }}<span v-if="leg.trainType" class="ml-1 text-slate-400">{{ leg.trainType }}</span>
                                                        </span>
                                                        <span>{{ leg.to || '抵達' }}</span>
                                                    </template>
                                                </div>

                                                <!-- 住宿：日期與晚數、電話、訂單 -->
                                                <div v-if="spot.type === 'hotel'" class="text-[11px] text-slate-500 font-bold space-y-1.5 mb-2">
                                                    <div v-if="spot.checkInDate || spot.checkOutDate" class="flex items-start">
                                                        <i class="fa-regular fa-calendar w-3.5 mt-0.5 shrink-0 text-slate-400"></i>
                                                        <span class="leading-tight font-sans">{{ fmtMD(spot.checkInDate) }} → {{ fmtMD(spot.checkOutDate) }}</span>
                                                        <span v-if="hotelNights(spot)" class="ml-1.5 text-[#1A5F8A]">{{ hotelNights(spot) }} 晚</span>
                                                        <span v-if="spot.checkInTime" class="ml-1.5 text-slate-400 font-sans">{{ spot.checkInTime }} 入住</span>
                                                    </div>
                                                    <div v-if="spot.phone || spot.bookingRef" class="flex items-start flex-wrap">
                                                        <a v-if="spot.phone" :href="'tel:' + spot.phone" @click.stop class="inline-flex items-center mr-3"><i class="fa-solid fa-phone w-3.5 shrink-0 text-slate-400 text-[10px]"></i><span class="font-sans">{{ spot.phone }}</span></a>
                                                        <span v-if="spot.bookingRef" class="inline-flex items-center"><i class="fa-solid fa-hashtag w-3.5 shrink-0 text-slate-400 text-[10px]"></i><span class="font-sans">{{ spot.bookingRef }}</span></span>
                                                    </div>
                                                    <div v-if="spot.transport" class="flex items-start">
                                                        <i class="fa-solid fa-route w-3.5 mt-0.5 shrink-0 text-slate-400"></i>
                                                        <span class="leading-snug line-clamp-2">{{ spot.transport }}</span>
                                                    </div>
                                                </div>

                                                <div v-if="spot.warning" class="flex items-start bg-[#9E0E26]/5 text-[#9E0E26] px-2 py-1.5 rounded-md mb-1.5 text-[11px] font-bold mt-1.5 w-full">
                                                    <i class="fa-solid fa-triangle-exclamation mt-0.5 mr-1.5 opacity-80"></i>
                                                    <span class="leading-snug">{{ spot.warning }}</span>
                                                </div>
                                                
                                                <!-- 一般筆記 (保留換行，最多3行) -->
                                                <div v-if="spot.desc" class="text-[12px] text-slate-500 leading-relaxed mt-1.5 mb-1 line-clamp-2 whitespace-pre-line">{{ spot.desc }}</div>
                                                <!-- 清單：必吃・必買・必拍・必做（卡片上直接勾） -->
                                                <div v-if="spot.checklist && spot.checklist.length" class="mt-2 mb-1.5 rounded-lg bg-slate-50 border border-slate-100 px-2.5 pt-1.5 pb-1">
                                                    <div class="flex items-center justify-between text-[10px] font-bold text-slate-400 mb-0.5">
                                                        <span>清單 <span class="font-sans">{{ spot.checklist.filter(x => x.done).length }}/{{ spot.checklist.length }}</span></span>
                                                        <span v-if="checklistTotal(spot)" class="font-sans">約 ¥{{ checklistTotal(spot).toLocaleString() }}</span>
                                                    </div>
                                                    <div v-for="(it, ci) in sortedChecklist(spot).filter(x => !x.done).slice(0, 4)" :key="'cc'+ci+(it.text||'')" @click.stop="it.done = !it.done" class="flex items-center py-[4px] cursor-pointer">
                                                        <span class="w-4 h-4 rounded-full border-[1.5px] flex items-center justify-center shrink-0 mr-2 transition-colors" :style="it.done ? { backgroundColor: kindColor(it.kind), borderColor: kindColor(it.kind) } : { borderColor: '#CBD5E1', backgroundColor: '#fff' }">
                                                            <i v-if="it.done" class="fa-solid fa-check text-white text-[7px]"></i>
                                                        </span>
                                                        <span class="text-[9px] font-bold px-1 py-[2px] rounded mr-1.5 shrink-0 leading-none" :style="kindChipStyle(it.kind)">{{ it.kind }}</span>
                                                        <span class="text-[12px] font-bold flex-1 min-w-0 truncate" :class="it.done ? 'text-slate-300 line-through' : 'text-slate-700'">{{ it.text || '未命名' }}</span>
                                                        <span v-if="it.brand" class="text-[9px] font-bold text-slate-400 ml-1.5 shrink-0">{{ it.brand }}</span>
                                                        <span v-if="it.price" class="text-[11px] font-bold text-slate-400 font-sans ml-1.5 shrink-0">¥{{ Number(String(it.price).replace(/[^\d.]/g, '') || 0).toLocaleString() }}</span>
                                                    </div>
                                                    <p v-if="spot.checklist.filter(x => !x.done).length > 4" class="text-[10px] font-bold text-slate-400 pl-6 pb-0.5">還有 {{ spot.checklist.filter(x => !x.done).length - 4 }} 項，點開看全部</p>
                                                    <p v-if="spot.checklist.every(x => x.done)" class="text-[11px] font-bold py-1 flex items-center" :style="{ color: currentTheme.text }"><i class="fa-solid fa-circle-check mr-1.5"></i>全部完成！</p>
                                                </div>

                                                <!-- 外部連結與附件 -->
                                                <div v-if="(spot.links && spot.links.length) || (spot.files && spot.files.length)" class="flex flex-wrap gap-1.5 mt-2 mb-1">
                                                    <a v-for="(link, lk) in spot.links" :key="'lk'+lk" :href="link.url" target="_blank" rel="noopener" @click.stop
                                                       class="inline-flex items-center text-[10px] font-bold text-[#1A5F8A] bg-[#EAF3F9] border border-[#9CC3DD]/70 px-2 py-1 rounded-md max-w-full">
                                                        <i class="fa-solid fa-link mr-1 text-[9px] shrink-0"></i><span class="truncate max-w-[150px]">{{ link.title }}</span>
                                                    </a>
                                                    <button type="button" v-for="(file, fk) in spot.files" :key="'fk'+fk" @click.stop="openFilePreview(file)"
                                                       class="inline-flex items-center text-[10px] font-bold text-slate-600 bg-slate-50 border border-slate-200 px-2 py-1 rounded-md max-w-full">
                                                        <i :class="'fa-solid ' + fileIcon(file) + ' mr-1 text-[9px] shrink-0 text-slate-400'"></i><span class="truncate max-w-[150px]">{{ file.name }}</span>
                                                    </button>
                                                </div>
                                                
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div v-else class="text-center py-20 text-slate-400">
                                    <i class="fa-solid fa-map-location-dot text-4xl mb-3 text-slate-300"></i>
                                    <p class="text-sm">這一天還沒有行程喔！<br>點擊右上角「+」開始排行程吧。</p>
                                </div>
                            </div>
                        </div>
                        <div class="h-10"></div>
                    </div>

                    <!-- Tab 2: 待辦清單 (Todo - 支援子類別結構) -->
                    <div v-show="currentTab === 'todo'" class="animate-fade-in px-4 pt-4 pb-6 min-h-full max-w-[430px] w-full">
                        <!-- 標題與總進度 -->
                        <div class="flex items-end justify-between mb-3 px-1">
                            <div>
                                <h2 class="text-xl font-bold text-slate-800">待辦與清單</h2>
                                <p class="text-[11px] font-bold text-slate-400 mt-0.5" v-if="todoTotals.total">已完成 <span class="text-slate-700 font-sans">{{ todoTotals.done }}</span> / <span class="font-sans">{{ todoTotals.total }}</span> 項</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button type="button" v-if="todoTotals.total" @click="hideDoneTodos = !hideDoneTodos" class="h-8 px-2.5 rounded-full text-[11px] font-bold border transition-colors bg-white"
                                        :style="hideDoneTodos ? { borderColor: currentTheme.line, color: currentTheme.text, backgroundColor: currentTheme.soft } : { borderColor: '#E2E8F0', color: '#64748B' }">
                                    <i class="fa-solid mr-1" :class="hideDoneTodos ? 'fa-eye-slash' : 'fa-eye'"></i>{{ hideDoneTodos ? '已隱藏完成' : '隱藏已完成' }}

    <script id="main-script">
        const { createApp } = Vue;

        // Leaflet 地圖與 ECharts 圖表物件放在 Vue 外面：
        // 放進 data() 會被 Vue 包成 Proxy，Leaflet 縮放/加標記時會出錯，導致地圖出不來
        let _leafletMap = null, _leafletLayer = null, _leafletResizeObs = null, _mapRenderToken = 0;
        let _expenseChart = null;
        let _pdfDoc = null;
        let _fbApp = null, _fbDb = null, _fbRef = null, _fbUnsub = null, _syncTimer = null, _syncLast = {}, _syncPendingRemote = null;
        const _geoCache = {};

        // ===== 資料儲存 =====
        // 舊版問題：App 開啟時資料庫還沒準備好就去讀，讀不到 → 以為是新使用者 → 回到設定頁，
        // 接著又把空白資料「存回去」蓋掉原本的行程。現在一律等資料庫準備好才讀寫，並多存一份備援。
        const DB_KEY = 'myTripData_v60_PRO';
        const LS_KEY = 'tripApp_backup_v1';
        let isDBAvailable = true;
        const dbPromise = new Promise((resolve) => {
            try {
                const request = indexedDB.open('TokyoTripAppDB_v60_PRO', 1);
                request.onupgradeneeded = (e) => { e.target.result.createObjectStore('store'); };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = () => { isDBAvailable = false; resolve(null); };
                request.onblocked = () => { isDBAvailable = false; resolve(null); };
            } catch (e) { isDBAvailable = false; resolve(null); }
        });
        // 請瀏覽器把資料標記為「持久保存」，降低被系統清除的機率

                calculatedDays() {
                    if (!this.tripInfo.startDate || !this.tripInfo.endDate) return 0;
                    const start = new Date(this.tripInfo.startDate);
                    const end = new Date(this.tripInfo.endDate);
                    if(end < start) return 0;
                    return Math.ceil(Math.abs(end - start) / (1000 * 60 * 60 * 24)) + 1;
                },

                        shopping: [['必買', '限定商品'], ['必買', '伴手禮'], ['必做', '辦理退稅'], ['必做', '集點／會員卡']]

                },
                // 同行者名單：旅客本人＋自訂付款人＋行程裡出現過的付款人
                peopleList() {
                    const set = [];
                    const add = (n) => { n = (n || '').trim(); if (n && n !== '自訂' && !set.includes(n)) set.push(n); };
                    (this.customPayers || []).forEach(add);
                    this.itinerary.forEach(d => (d.spots || []).forEach(sp => { add(sp.payer); (sp.advances || []).forEach(a => add(a.person)); }));
                    return set;
                },
                advanceCandidates() {
                    const payer = this.selectedSpot && this.selectedSpot.payer;
                    return this.peopleList.filter(p => p !== payer);
                },
                // 分帳：A 要給 B 多少（台幣，兩人之間互相抵銷）
                settlement() {
                    const details = [];
                    this.itinerary.forEach((day, dIdx) => (day.spots || []).forEach((sp, sIdx) => {
                        if (!sp.isAdvance || !sp.payer || !Array.isArray(sp.advances)) return;
                        sp.advances.forEach(a => {
                            const amt = parseFloat(String(a.amount || '').replace(/[^\d.]/g, '')) || 0;
                            if (!amt || !a.person || a.person === sp.payer) return;
                            const ntd = sp.currency === 'JPY' ? amt * this.exchangeRateJPYtoTWD : amt;
                            details.push({ from: a.person, to: sp.payer, orig: amt, ntd, currency: sp.currency, name: sp.name || '未命名', date: day.shortDate, dayIdx: dIdx, spotIdx: sIdx });
                        });
                    }));
                    const net = {};
                    details.forEach(d => {
                        const [x, y] = [d.from, d.to].sort();
                        const k = x + '\u0000' + y;
                        net[k] = (net[k] || 0) + (d.from === x ? d.ntd : -d.ntd);
                    });
                    const results = Object.keys(net).map(k => {
                        const [x, y] = k.split('\u0000'); const v = net[k];
                        return v > 0 ? { from: x, to: y, ntd: v } : { from: y, to: x, ntd: -v };
                    }).filter(r => Math.round(r.ntd) > 0).sort((a, b) => b.ntd - a.ntd);
                    return { results, details };
                },
                syncStatusText() {
                    const st = this.sync.status;
                    if (st === 'connecting') return '連線中…';
                    if (st === 'syncing') return '同步中…';
                    if (st === 'error') return '同步出了點問題';
                    if (st === 'online') {
                        if (!this.sync.lastAt) return '已連線';
                        const m = Math.floor((this.nowTick - this.sync.lastAt) / 60000);
                        return m < 1 ? '已同步・剛剛' : `已同步・${m} 分鐘前`;
                    }
                    return '未連線';
                },
                todoTotals() {
                    let done = 0, total = 0;
                    this.todoCategories.forEach(c => (c.subcategories || []).forEach(s => (s.items || []).forEach(i => { total++; if (i.done) done++; })));
                    return { done, total };
                },
                currentDaySpotCount() {
                    const d = this.itinerary[this.activeDay];
                    return d && d.spots ? d.spots.length : 0;
                },
                navSpotsForMapDay() {
                    if (this.mapFilterDay === -1 || !this.itinerary[this.mapFilterDay]) return [];
                    return (this.itinerary[this.mapFilterDay].spots || []).filter(spot => spot.type !== 'transit' && (spot.location || spot.googleMapUrl));
                },
                expenseBreakdown() {
                    const map = {};
                    let total = 0;
                    this.itinerary.forEach(day => {
                        (day.spots || []).forEach(spot => {
                            if (!(spot.cost && Number(spot.cost) > 0)) return;
                            const key = this.getExpenseKey(spot);
                            const ntd = this.toNTD(spot);
                            map[key] = (map[key] || 0) + ntd;
                            total += ntd;
                        });
                    });
                    const palette = this.expensePalette;
                    return Object.keys(map)
                        .map(k => ({ name: k, value: Math.round(map[k]), pct: total > 0 ? (map[k] / total * 100) : 0 }))
                        .sort((a, b) => b.value - a.value)
                        .map((row, i) => ({ ...row, color: palette[i % palette.length] }));
                },
                expenseBreakdownTotal() {
                    return this.expenseBreakdown.reduce((sum, r) => sum + r.value, 0);
                },
                expenseDetailItems() {
                    if (!this.expenseDetailKey) return [];
                    const items = [];
                    this.itinerary.forEach((day, dIdx) => {
                        (day.spots || []).forEach((spot, sIdx) => {
                            if (!(spot.cost && Number(spot.cost) > 0)) return;
                            if (this.getExpenseKey(spot) !== this.expenseDetailKey) return;
                            items.push({
                                dayIdx: dIdx, spotIdx: sIdx, dayLabel: day.label, shortDate: day.shortDate, rawDate: day.rawDate || '', dayOfWeekEN: day.dayOfWeekEN,
                                time: spot.startTime || spot.checkInTime || '', name: spot.name || '未命名', type: spot.type,
                                currency: spot.currency, cost: Number(spot.cost), ntd: Math.round(this.toNTD(spot)),
                                category: this.getExpenseCategory(spot), payer: spot.payer || '未設定', method: spot.paymentMethod || '現金'
                            });
                        });
                    });
                    items.sort((a, b) => (a.rawDate.localeCompare(b.rawDate)) || (a.dayIdx - b.dayIdx) || ((a.time || '99:99').localeCompare(b.time || '99:99')) || (a.spotIdx - b.spotIdx));
                    // 依日期分組
                    const groups = [];
                    items.forEach(it => {
                        let g = groups[groups.length - 1];
                        if (!g || g.dayIdx !== it.dayIdx) { g = { dayIdx: it.dayIdx, dayLabel: it.dayLabel, shortDate: it.shortDate, dayOfWeekEN: it.dayOfWeekEN, subtotal: 0, items: [] }; groups.push(g); }
                        g.items.push(it); g.subtotal += it.ntd;
                    });
                    return groups;
                },
                expenseDetailSummary() {
                    const row = this.expenseBreakdown.find(r => r.name === this.expenseDetailKey);
                    const count = this.expenseDetailItems.reduce((n, g) => n + g.items.length, 0);
                    return { total: row ? row.value : 0, pct: row ? row.pct : 0, color: row ? row.color : '#7E93A3', count };
                },
                expenseFilterLabel() {
                    return { category: '大類別', payer: '付款人', method: '付款方式', tag: '花費標籤' }[this.expenseFilterType] || '';
                },
                expensePalette() {
                    return this.currentTheme.palette;
                },
                routeSpotsForDay() {
                    if (!this.itinerary[this.routeActiveDay] || !this.itinerary[this.routeActiveDay].spots) return [];
                    return this.itinerary[this.routeActiveDay].spots.filter(spot => spot.location || spot.googleMapUrl);
                },

                overviewHotels() {
                    // 有填入住＋退房日期 → 直接算晚數；沒填退房 → 用同一家飯店連續出現的天數推算
                    const list = [], seen = {};
                    this.itinerary.forEach((day, dIdx) => (day.spots || []).forEach((spot, sIdx) => {
                        if (spot.type !== 'hotel') return;
                        const name = spot.name || '住宿';
                        if (spot.checkInDate && spot.checkOutDate && this.hotelNights(spot) > 0) {
                            const key = name + '|' + spot.checkInDate + '|' + spot.checkOutDate;
                            if (seen[key]) return;   // 同一筆訂房在好幾天都有卡片，只算一次
                            seen[key] = true;
                            list.push({ name, start: spot.checkInDate, end: spot.checkOutDate, nights: this.hotelNights(spot), dayIdx: dIdx, spotIdx: sIdx });
                        } else {
                            const start = spot.checkInDate || day.rawDate;
                            const last = list[list.length - 1];
                            if (last && last.fallback && last.name === name && last.lastDayIdx === dIdx - 1) {
                                last.nights += 1; last.end = this.addDaysYMD(day.rawDate, 1); last.lastDayIdx = dIdx;
                                return;
                            }
                            list.push({ name, start, end: this.addDaysYMD(start, 1), nights: 1, dayIdx: dIdx, spotIdx: sIdx, fallback: true, lastDayIdx: dIdx });
                        }
                    }));
                    list.sort((x, y) => (x.start || '').localeCompare(y.start || ''));
                    return list.map(h => ({ ...h, dateStr: `${this.fmtMD(h.start)} - ${this.fmtMD(h.end)}` }));
                }
            },

                    // 空白天加入第一個行程時，清單才出現，要重新綁定拖曳
                    if (this.currentTab === 'itinerary' && !this.isDraggingSpot && (oldVal === 0 || newVal === 0)) {
                        this.$nextTick(() => { this.initSortableItinerary(); });

            async mounted() {
                // 匯率：先用上次存下的，再視情況更新；之後每小時自動更新一次
                try {
                    const cached = JSON.parse(localStorage.getItem('tripApp_rate') || 'null');
                    if (cached && cached.rate > 0) { this.exchangeRateJPYtoTWD = cached.rate; this.rateUpdatedAt = cached.at; this.rateSourceDate = cached.date || ''; }
                } catch (e) {}
                this.onConvInput('jpy', this.convJPY);
                if (Date.now() - this.rateUpdatedAt > 3600000) this.fetchRate();
                setInterval(() => { if (Date.now() - this.rateUpdatedAt > 3600000) this.fetchRate(); }, 5 * 60000);
                document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - this.rateUpdatedAt > 3600000) this.fetchRate(); });

                // 離開 App / 切到背景時，立刻把還沒存的變更存起來（iPhone 可能直接關掉 App）
                const flush = () => { if (this.isStateLoaded && this.saveTimeout) { clearTimeout(this.saveTimeout); this.saveTimeout = null; this.saveNow(); } };
                document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flush(); });
                window.addEventListener('pagehide', flush);
                // 每分鐘更新「現在」紅點
                setInterval(() => { this.nowTick = Date.now(); }, 60000);
                document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') this.nowTick = Date.now(); });
                // 鎖定畫面縮放（iPhone 雙指縮放）
                document.addEventListener('gesturestart', (e) => e.preventDefault());

                if (window.__PRELOADED_STATE__) {
                    this.restoreState(window.__PRELOADED_STATE__);
                    this.isStateLoaded = true;
                    this.applyTheme();
                    return;
                }
                
                try {
                    const savedData = await loadFromDB(DB_KEY);
                    if (savedData && savedData.itinerary) {
                        this.restoreState(savedData);
                    } else {
                        let today = new Date();
                        let next = new Date(today); next.setDate(today.getDate() + 5);
                        this.tripInfo.startDate = this.toYMD(today);
                        this.tripInfo.endDate = this.toYMD(next);
                        this.migrateFlights();
                    }
                } catch (e) {
                    console.warn("DB Load failed", e);
                }
                this.applyTheme();
                // 雲端同步：有設定過就自動連線；網址帶邀請碼就詢問是否加入
                this.loadSyncSettings();
                if (this.sync.enabled) this.connectSync().then(ok => { if (ok) this.schedulePush(500); });
                if (/#join=/.test(location.hash)) {
                    const link = location.href;
                    history.replaceState(null, '', location.pathname + location.search);
                    setTimeout(() => this.joinCloudTrip(link), 600);
                }
                window.addEventListener('online', () => { if (this.sync.enabled) { this.connectSync().then(() => this.schedulePush(300)); } });
                // 讀取完成後才開始自動儲存，避免空白資料蓋掉原本的行程
                this.$nextTick(() => { this.isStateLoaded = true; });
            },

                blankFlight() {

                                                                         seat: t.seat || '', boardingTime: t.boardingTime || '', date: t.startDate || '' });

                    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;

                parseYMD(str) {
                    if (!str) return null;

                formatCurrency(num) {

                        hero: { image: 'https://images.unsplash.com/photo-1542051812871-7022cb3359d9?w=800&q=80', title: '自由活動', location: this.tripInfo.destination, position: 50 },

                // 依新的日期區間，算出每一天要放哪些行程

                // ・天數改變 → 依「日期」對應；新區間外的日子會被移除（有行程會先詢問）
                planItineraryDates() {
                    const start = this.parseYMD(this.tripInfo.startDate), end = this.parseYMD(this.tripInfo.endDate);
                    const newDates = [];
                    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) newDates.push(this.toYMD(d));
                    const old = this.itinerary;
                    let result, removed = [];
                    if (newDates.length === old.length) {
                        result = old.slice();
                    } else {
                        const byDate = {};
                        old.forEach(day => { if (day.rawDate) byDate[day.rawDate] = day; });
                        const overlap = newDates.some(d => byDate[d]);
                        if (overlap) {
                            result = newDates.map(d => byDate[d] || this.makeEmptyDay());
                            removed = old.filter(day => !newDates.includes(day.rawDate));
                        } else {
                            result = newDates.map((d, i) => old[i] || this.makeEmptyDay());
                            removed = old.slice(newDates.length);
                        }
                    }
                    return { newDates, result, removed };

                applyItineraryPlan(plan) {
                    const weekDaysEN = ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];

                        const dt = this.parseYMD(plan.newDates[i]);
                        const m = String(dt.getMonth() + 1).padStart(2, '0'), d = String(dt.getDate()).padStart(2, '0');
                        day.rawDate = plan.newDates[i];
                        day.shortDate = `${m}/${d}`;
                        day.dayNum = d;
                        day.dayOfWeekEN = weekDaysEN[dt.getDay()];
                        day.label = `Day ${i + 1}`;

                    this.itinerary = plan.result;
                    this.ensureSpotIds();
                    if (this.activeDay >= this.itinerary.length) this.activeDay = Math.max(0, this.itinerary.length - 1);

                // 自訂交通方式：依名稱自動判斷圖示與填寫方式

                        [/渡輪|渡船|輪船|船|遊船|郵輪|ferry|ship|boat|cruise|水上巴士/, 'fa-ferry', 'rail'],

                        [/江之電|路面電車|都電|荒川|tram|streetcar|輕軌/, 'fa-train-tram', 'rail'],

                        [/地鐵|捷運|metro|subway/, 'fa-train-subway', 'rail'],
                        [/新幹線|高鐵|特急|列車|火車|電車|鐵|jr|train|rail|skyliner|n'ex|haruka/, 'fa-train', 'rail'],

                // --- 下載目前這一面的機票（透明背景 PNG） ---

                            const pdfjs = await this.loadPdfJs();
                            _pdfDoc = await pdfjs.getDocument({ data: this.dataUrlToBytes(file.url) }).promise;
                            await this.renderPdfPages();
                        } catch (e) {
                            console.error(e);
                            this.filePreviewStatus = '這個 PDF 無法預覽（' + e.message + '），可按「分享/儲存」用其他 App 開啟。';
                        }
                    }
                },
                async renderPdfPages() {
                    await this.$nextTick();
                    const host = document.getElementById('pdf-pages');
                    const body = document.getElementById('file-preview-body');
                    if (!host || !body || !_pdfDoc) return;
                    host.innerHTML = '';
                    const doc = _pdfDoc;
                    const baseWidth = Math.max(200, body.clientWidth - 16);
                    const dpr = Math.min(window.devicePixelRatio || 1, 2);
                    this.filePreviewStatus = '';
                    for (let i = 1; i <= doc.numPages; i++) {
                        if (doc !== _pdfDoc) return;
                        const page = await doc.getPage(i);
                        const vp1 = page.getViewport({ scale: 1 });
                        const cssW = baseWidth * this.filePreviewZoom;
                        const vp = page.getViewport({ scale: (cssW / vp1.width) * dpr });
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.floor(vp.width); canvas.height = Math.floor(vp.height);
                        canvas.style.width = cssW + 'px'; canvas.style.maxWidth = 'none';
                        canvas.style.background = '#fff'; canvas.style.borderRadius = '4px';
                        host.appendChild(canvas);
                        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
                    }
                },
                setPreviewZoom(dir) {
                    const steps = [1, 1.5, 2, 2.5];
                    let i = steps.indexOf(this.filePreviewZoom);
                    if (i < 0) i = 0;
                    i = Math.max(0, Math.min(steps.length - 1, i + dir));
                    if (steps[i] === this.filePreviewZoom) return;
                    this.filePreviewZoom = steps[i];
                    if (this.filePreview && this.filePreview.kind === 'pdf') this.renderPdfPages();
                },
                closeFilePreview() {
                    this.filePreview = null; _pdfDoc = null;
                },
                async shareFile(file) {
                    try {
                        const mime = this.dataUrlMime(file.url);
                        const blob = new Blob([this.dataUrlToBytes(file.url)], { type: mime });
                        const f = new File([blob], file.name || 'file', { type: mime });
                        if (navigator.canShare && navigator.canShare({ files: [f] })) {
                            await navigator.share({ files: [f], title: file.name });
                            return;
                        }
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement('a');
                        a.href = url; a.download = file.name || 'file'; a.target = '_blank';
                        document.body.appendChild(a); a.click(); a.remove();
                        setTimeout(() => URL.revokeObjectURL(url), 60000);
                    } catch (e) {
                        if (e && e.name === 'AbortError') return;
                        alert('無法分享這個檔案：' + e.message);
                    }
                },

                swapDays(a, b) {
                    if (a === b || !this.itinerary[a] || !this.itinerary[b]) return;
                    const A = this.itinerary[a], B = this.itinerary[b];
                    const keys = ['hero', 'spots', 'customSorted'];
                    keys.forEach(k => { const tmp = A[k]; A[k] = B[k]; B[k] = tmp; });
                    this.showSwapModal = false;
                    this.$nextTick(() => { this.initSortableItinerary(); });
                    this.showToast(`已將 ${A.label} 與 ${B.label} 的行程對調`);
                },
                showToast(msg) {

                    this._toastTimer = setTimeout(() => { this.toastMsg = ''; }, 2200);
                },
                jumpToDay(dayIdx) {

                jumpToSpot(dayIdx, spotIdx) {

                    });
                },

                // 每個行程卡片需要固定 id，Vue 才能正確追蹤拖曳後的位置

                ensureSpotIds() {
                    const seen = new Set();
                    this.itinerary.forEach(day => {
                        (day.spots || []).forEach(spot => {
                            if (!spot.id || seen.has(spot.id)) spot.id = this.makeSpotId();
                            seen.add(spot.id);

                        });

                },

                initSortableItinerary() {
                    try {
                        this.ensureSpotIds();
                        if(this.sortableInstances['itinerary']) { this.sortableInstances['itinerary'].destroy(); this.sortableInstances['itinerary'] = null; }
                        const listEl = document.getElementById('sortable-list-' + this.activeDay);
                        if(!listEl) return;

                        this.sortableInstances['itinerary'] = new Sortable(listEl, {
                            draggable: '.spot-item',
                            handle: '.draggable-card',
                            animation: 180,
                            easing: 'cubic-bezier(0.2, 0, 0, 1)',
                            // 手機長按才開始拖曳，避免跟頁面捲動打架
                            delay: 220, delayOnTouchOnly: true, touchStartThreshold: 8,
                            // 統一使用自製拖曳（桌機 / 手機行為一致，且能邊拖邊自動捲動）

                            scroll: document.getElementById('main-scroll') || true,
                            scrollSensitivity: 110, scrollSpeed: 16, bubbleScroll: true,

                                this.isDraggingSpot = false;

                                const oldIndex = evt.oldDraggableIndex;
                                const newIndex = evt.newDraggableIndex;
                                if (oldIndex == null || newIndex == null || oldIndex === newIndex) return;
                                
                                // 先把 Sortable 移動過的 DOM 放回原位，再交給 Vue 依資料重新排列
                                // （否則 Vue 與 Sortable 會互相覆蓋，造成卡片跳回去、要拖好幾次才到位）
                                const { item, from } = evt;
                                from.removeChild(item);
                                const siblings = Array.from(from.children).filter(el => el.classList.contains('spot-item'));
                                if (siblings[oldIndex]) from.insertBefore(item, siblings[oldIndex]);
                                else if (siblings.length) siblings[siblings.length - 1].after(item);
                                else from.appendChild(item);
                                
                                const spots = this.itinerary[dayIdx].spots;

                        });

                },
                
                initSortableTodo() {
                    try {
                        this.todoCategories.forEach((cat, cIdx) => {
                            if(!cat.subcategories) return;
                            cat.subcategories.forEach((sub, sIdx) => {
                                const itemList = document.getElementById(`todo-items-list-${cIdx}-${sIdx}`);

                                            const { item, from } = evt;
                                            from.removeChild(item);
                                            const sib = Array.from(from.children).filter(el => el.classList.contains('todo-item'));
                                            if (sib[oldIndex]) from.insertBefore(item, sib[oldIndex]);
                                            else if (sib.length) sib[sib.length - 1].after(item);
