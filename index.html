                },

                // --- 解析「Google Maps 欄位」內容 ---
                // 支援：完整網址（含 @座標 或 !3d!4d）、直接貼座標「35.7312, 139.7289」、
                //       從 Google Maps App「分享」整段貼上的文字（店名＋地址＋短網址）
                parseLatLngFromUrl(url) {
                    if (!url) return null;
                    let u = String(url);
                    try { u = decodeURIComponent(u); } catch (e) {}
                    const ok = (a, b) => { a = parseFloat(a); b = parseFloat(b); return (isFinite(a) && isFinite(b) && Math.abs(a) <= 90 && Math.abs(b) <= 180 && !(a === 0 && b === 0)) ? { lat: a, lng: b } : null; };
                    let m;
                    if ((m = u.match(/!3d(-?\d+\.?\d*)!4d(-?\d+\.?\d*)/))) return ok(m[1], m[2]);      // 地點的精確座標（優先）
                    if ((m = u.match(/[?&](?:q|ll|query|destination|center)=(-?\d+\.?\d*),\s*(-?\d+\.?\d*)/))) return ok(m[1], m[2]);
                    if ((m = u.match(/\/place\/(-?\d+\.\d+),\s*(-?\d+\.\d+)/))) return ok(m[1], m[2]);
                    if ((m = u.match(/@(-?\d+\.?\d*),(-?\d+\.?\d*)/))) return ok(m[1], m[2]);          // 視角中心
                    // 直接貼上的座標（Google Maps 長按地點 → 複製座標）
                    if ((m = u.match(/(-?\d{1,2}\.\d{3,})\s*[,，]\s*(-?\d{1,3}\.\d{3,})/))) return ok(m[1], m[2]);
                    return null;
                },
                extractMapUrl(text) {
                    const m = String(text || '').match(/https?:\/\/\S+/);
                    return m ? m[0] : '';
                },
                isShortMapLink(text) {
                    return /(maps\.app\.goo\.gl|goo\.gl\/maps|g\.co\/kgs)/i.test(String(text || ''));
                },
                // 分享文字裡「網址以外」的部分（通常是 店名＋地址），Google 自己產生的，拿來搜尋最準
                extractShareText(text) {
                    let t = String(text || '');
                    if (!t.trim() || this.parseLatLngFromUrl(t)) return '';
                    t = t.replace(/https?:\/\/\S+/g, ' ')
                         .split(/\n+/).map(x => x.replace(/\s+/g, ' ').trim()).filter(Boolean).join(', ');
                    if (/^-?\d+\.\d+\s*[,，]/.test(t)) return '';
                    return t;
                },
                getMapFieldStatus(spot) {
                    const v = (spot && spot.googleMapUrl || '').trim();
                    if (!v) return { kind: 'empty' };
                    const c = this.parseLatLngFromUrl(v);
                    if (c) return { kind: 'exact', text: `${c.lat.toFixed(5)}, ${c.lng.toFixed(5)}` };
                    const share = this.extractShareText(v);
                    if (share) return { kind: 'share', text: share };
                    if (this.isShortMapLink(v)) return { kind: 'short', url: this.extractMapUrl(v) };
                    const pn = this.parsePlaceNameFromUrl(v);
                    if (pn) return { kind: 'share', text: pn };
                    return { kind: 'unknown' };
                },
                getSpotMapHref(spot) {
                    const url = this.extractMapUrl(spot.googleMapUrl);
                    if (url) return url;
                    const c = this.parseLatLngFromUrl(spot.googleMapUrl);
                    if (c) return `https://www.google.com/maps/search/?api=1&query=${c.lat},${c.lng}`;
                    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(this.getNavQuery(spot))}`;
                },
                escapeHtml(str) {
                    return String(str == null ? '' : str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
                },

                // --- 日本行程：繁體字轉日文漢字（豐島區 → 豊島区），搜尋才找得到 ---
                isJapanTrip() {
                    return /日本/.test(this.tripInfo.country || '') || /japan/i.test(this.tripInfo.countryEN || '');
                },
                toJapaneseKanji(text) {
                    if (!text || !this.isJapanTrip()) return text || '';
                    const map = { '區':'区','豐':'豊','澀':'渋','濱':'浜','驛':'駅','櫻':'桜','淺':'浅','廣':'広','縣':'県','惠':'恵','參':'参','澤':'沢','邊':'辺','關':'関','齋':'斎','條':'条','會':'会','國':'国','萬':'万','寶':'宝','燒':'焼','黑':'黒','圓':'円','鐵':'鉄','藥':'薬','實':'実','發':'発','樂':'楽','橫':'横','鄉':'郷','壽':'寿','戶':'戸','臺':'台','舊':'旧','德':'徳','龜':'亀','晝':'昼','價':'価','賣':'売','專':'専','點':'点','樓':'楼','灣':'湾','廳':'庁','號':'号','莊':'荘','屆':'届','雙':'双','團':'団','淨':'浄','靜':'静','稻':'稲','藏':'蔵','瀧':'滝','鹽':'塩','禮':'礼','齒':'歯','醫':'医','總':'総','聽':'聴','麵':'麺','燈':'灯','劍':'剣','溫':'温' };
                    return String(text).replace(/[\u3400-\u9fff]/g, ch => map[ch] || ch);
                },

                // --- Map Functionality ---
                loadScriptOnce(src, timeoutMs) {
                    window.__loadedScripts = window.__loadedScripts || {};
                    if (window.__loadedScripts[src]) return window.__loadedScripts[src];
                    const p = new Promise((resolve, reject) => {
                        const sc = document.createElement('script');
                        sc.src = src; sc.async = true;
                        const t = setTimeout(() => reject(new Error('timeout')), timeoutMs || 8000);
                        sc.onload = () => { clearTimeout(t); resolve(); };
                        sc.onerror = () => { clearTimeout(t); reject(new Error('load failed')); };
                        document.head.appendChild(sc);
                    });
                    window.__loadedScripts[src] = p;
                    return p;
                },
                // 底圖：優先用 OpenFreeMap 的向量地圖（色彩接近 Google 地圖，免金鑰），
                // 載不到（網路、手機不支援 WebGL）就自動改用一般圖磚
                setupMapTiles(map) {
                    const useRaster = () => {
                        if (map.__rasterUsed) return;
                        map.__rasterUsed = true;
                        const providers = [
                            () => L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap' }),
                            () => L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Tiles &copy; Esri' }),
                            () => L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '地理院タイル' })
                        ];
                        let idx = 0, errors = 0, loaded = 0, current = null;
                        const use = (i) => {
                            if (current) map.removeLayer(current);
                            errors = 0; loaded = 0;
                            current = providers[i]();
                            current.on('tileload', () => { loaded++; });
                            current.on('tileerror', () => {
                                errors++;
                                if (loaded === 0 && errors >= 4 && idx < providers.length - 1) { idx++; use(idx); }
                            });
                            current.addTo(map);
                        };
                        use(0);
                    };
                    if (!document.getElementById('maplibre-css')) {
                        const link = document.createElement('link');
                        link.id = 'maplibre-css'; link.rel = 'stylesheet';
                        link.href = 'https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.css';
                        document.head.appendChild(link);
                    }
                    this.loadScriptOnce('https://cdn.jsdelivr.net/npm/maplibre-gl@4/dist/maplibre-gl.js', 8000)
                        .then(() => this.loadScriptOnce('https://cdn.jsdelivr.net/npm/@maplibre/maplibre-gl-leaflet@0/leaflet-maplibre-gl.js', 8000))
                        .then(() => {
                            if (!window.maplibregl || !L.maplibreGL || map.__rasterUsed) throw new Error('no maplibre');
                            const gl = L.maplibreGL({
                                style: 'https://tiles.openfreemap.org/styles/liberty',
                                attribution: '<a href="https://openfreemap.org" target="_blank">OpenFreeMap</a> &copy; OpenStreetMap'
                            }).addTo(map);
                            let ok = false;
                            const glMap = gl.getMaplibreMap ? gl.getMaplibreMap() : null;
                            if (glMap) {
                                glMap.on('load', () => { ok = true; });
                                glMap.on('error', () => { if (!ok) { try { map.removeLayer(gl); } catch (e) {} useRaster(); } });
                            }
                            setTimeout(() => { if (!ok) { try { map.removeLayer(gl); } catch (e) {} useRaster(); } }, 9000);
                        })
                        .catch(() => useRaster());
                },
                ensureMap() {
                    const el = document.getElementById('itinerary-map');
                    if (!el) return null;
                    if (typeof L === 'undefined') {
                        this.mapError = '地圖元件沒有載入成功，請確認網路連線後重新整理頁面。';
                        return null;
                    }
                    if (_leafletMap && _leafletMap.getContainer() !== el) {
                        try { _leafletMap.remove(); } catch (e) {}
                        _leafletMap = null; _leafletLayer = null;
                    }
                    if (!_leafletMap) {
                        _leafletMap = L.map(el, { zoomControl: false }).setView([35.6895, 139.6917], 11);
                        L.control.zoom({ position: 'topleft' }).addTo(_leafletMap);
                        this.setupMapTiles(_leafletMap);
                        _leafletLayer = L.layerGroup().addTo(_leafletMap);
                        if (window.ResizeObserver) {
                            if (_leafletResizeObs) _leafletResizeObs.disconnect();
                            _leafletResizeObs = new ResizeObserver(() => { if (_leafletMap) _leafletMap.invalidateSize(); });
                            _leafletResizeObs.observe(el);
                        }
                    }
                    _leafletMap.invalidateSize();
                    return _leafletMap;
                },
                collectMapPoints() {
                    const pts = [];
                    for (let d = 0; d < this.itinerary.length; d++) {
                        if (this.mapFilterDay !== -1 && this.mapFilterDay !== d) continue;
                        const day = this.itinerary[d];
                        let num = 1;
                        (day.spots || []).forEach((spot, s) => {
                            if (spot.type === 'transit') return;
                            if (!spot.location && !spot.googleMapUrl) return;   // 與導航站點一致
                            // Google Maps 欄位有座標 → 永遠以它為準
                            const c = this.parseLatLngFromUrl(spot.googleMapUrl);
                            if (c) { spot.lat = c.lat; spot.lng = c.lng; spot.geoSource = 'url'; }
                            const has = spot.lat && spot.lng;
                            pts.push({ dayIdx: d, spotIdx: s, num: num++, name: spot.name || spot.location, dayLabel: day.label,
                                       color: this.getDayColor(d),
                                       status: has ? (spot.geoSource === 'url' ? 'exact' : 'approx') : 'pending',
                                       lat: has ? Number(spot.lat) : null, lng: has ? Number(spot.lng) : null });
                        });
                    }
                    return pts;
                },
                drawMapPoints(pts, fit) {
                    if (!_leafletMap || !_leafletLayer) return;
                    _leafletLayer.clearLayers();
                    const ready = pts.filter(p => p.lat != null && p.lng != null);
                    const byDay = {};
                    ready.forEach(p => { (byDay[p.dayIdx] = byDay[p.dayIdx] || []).push(p); });
                    Object.keys(byDay).forEach(k => {
                        const dayPts = byDay[k].sort((a, b) => a.num - b.num);
                        if (dayPts.length > 1) L.polyline(dayPts.map(p => [p.lat, p.lng]), { color: inkOn(dayPts[0].color) === '#fff' ? dayPts[0].color : '#0096C7', weight: 3, dashArray: '6, 6', opacity: 0.9 }).addTo(_leafletLayer);
                    });
                    ready.forEach(p => {
                        const approx = p.status === 'approx';
                        const html = approx
                            ? `<div style="background:#fff;width:24px;height:24px;border-radius:50%;color:${p.color};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;border:2px dashed ${p.color};box-shadow:0 2px 4px rgba(0,0,0,.25);font-family:sans-serif;">${p.num}</div>`
                            : `<div style="background:${p.color};width:24px;height:24px;border-radius:50%;color:${inkOn(p.color)};display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:bold;border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.3);font-family:sans-serif;">${p.num}</div>`;
                        L.marker([p.lat, p.lng], { icon: L.divIcon({ html, className: 'leaflet-custom-marker', iconSize: [24, 24], iconAnchor: [12, 12] }) })
                         .bindPopup(`<b>${this.escapeHtml(p.dayLabel)}</b><br>${this.escapeHtml(p.name)}${approx ? '<br><span style="color:#94a3b8;font-size:11px;">推測位置，可能不準</span>' : ''}`)
                         .addTo(_leafletLayer);
                    });
                    if (fit && ready.length > 0) {
                        _leafletMap.invalidateSize();
                        if (ready.length === 1) _leafletMap.setView([ready[0].lat, ready[0].lng], 15, { animate: false });
                        else _leafletMap.fitBounds(L.latLngBounds(ready.map(p => [p.lat, p.lng])), { padding: [30, 30], maxZoom: 15, animate: false });
                    }
                },
                buildGeoQueries(spot) {
                    const J = (t) => this.toJapaneseKanji(t);
                    const name = (spot.name || '').trim();
                    const loc = (spot.location || '').trim();
                    const share = this.extractShareText(spot.googleMapUrl);
                    const place = this.parsePlaceNameFromUrl(spot.googleMapUrl);
                    const city = (this.tripInfo.destination || '').trim();
                    const list = [];
                    const add = (q) => { q = (q || '').trim(); if (q && !list.includes(q)) list.push(q); };
                    // 由精準到粗略
                    if (share) { add(share); const addr = share.match(/〒?\s*\d{3}-?\d{4}.*$/); if (addr) add(addr[0]); }
                    if (this.looksLikeAddress(loc)) { add(J(loc)); add(loc); }
                    if (place) add(place);
                    if (name && loc && !this.looksLikeAddress(loc)) add(J(`${name} ${loc}`));
                    if (name) add(J(name.includes(city) ? name : `${name} ${city}`));
                    return list.slice(0, 5);
                },
                distanceKm(a, b) {
                    const R = 6371, toR = x => x * Math.PI / 180;
                    const dLat = toR(b.lat - a.lat), dLng = toR(b.lng - a.lng);
                    const h = Math.sin(dLat / 2) ** 2 + Math.cos(toR(a.lat)) * Math.cos(toR(b.lat)) * Math.sin(dLng / 2) ** 2;
                    return 2 * R * Math.asin(Math.sqrt(h));
                },
                async nominatim(q) {
                    try {
                        const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=zh-TW,ja,en&q=${encodeURIComponent(q)}`);
                        if (!r.ok) return null;
                        const d = await r.json();
                        return d && d.length ? { lat: parseFloat(d[0].lat), lng: parseFloat(d[0].lon) } : null;
                    } catch (e) { return null; }
                },
                async getCityCenter() {
                    const key = '__city__' + (this.tripInfo.destination || '') + '|' + (this.tripInfo.country || '');
                    if (_geoCache[key] !== undefined) return _geoCache[key];
                    const q = [this.tripInfo.destinationEN || this.tripInfo.destination, this.tripInfo.countryEN || this.tripInfo.country].filter(Boolean).join(', ');
                    const c = q ? await this.nominatim(q) : null;
                    _geoCache[key] = c;
                    return c;
                },
                // 只有 OpenStreetMap 真的找到、而且離旅遊城市 60 公里內才採用（避免亂標到別的地方）
                async geocodeOne(q, center) {
                    const key = q + '|' + (center ? center.lat.toFixed(2) + ',' + center.lng.toFixed(2) : '');
                    if (_geoCache[key] !== undefined) return _geoCache[key];
                    let result = await this.nominatim(q);
                    if (result && center && this.distanceKm(result, center) > 60) result = null;
                    _geoCache[key] = result;
                    return result;
                },
                async renderMap() {
                    const token = ++_mapRenderToken;
                    this.mapError = ''; this.mapFailedSpots = []; this.mapProgress = ''; this.mapEmpty = false;
                    let map;
                    try { map = this.ensureMap(); } catch (e) { this.mapError = '地圖建立失敗：' + e.message; console.error(e); return; }
                    if (!map) return;
                    
                    try {
                        const pts = this.collectMapPoints();
                        this.mapStops = pts;
                        this.mapEmpty = pts.length === 0;
                        this.drawMapPoints(pts, true);
                        
                        const missing = pts.filter(p => p.lat == null);
                        if (missing.length === 0) { this.isMapLoading = false; return; }
                        this.isMapLoading = true;
                        const center = await this.getCityCenter();
                        if (token !== _mapRenderToken) return;
                        
                        for (let i = 0; i < missing.length; i++) {
                            if (token !== _mapRenderToken) return;
                            const p = missing[i];
                            this.mapProgress = `${i + 1}/${missing.length}`;
                            const spot = this.itinerary[p.dayIdx] && this.itinerary[p.dayIdx].spots[p.spotIdx];
                            if (!spot) continue;
                            let found = null;
                            for (const q of this.buildGeoQueries(spot)) {
                                await new Promise(r => setTimeout(r, 1100));   // 免費定位服務限每秒 1 次
                                if (token !== _mapRenderToken) return;
                                found = await this.geocodeOne(q, center);
                                if (found) break;
                            }
                            if (found) {
                                spot.lat = found.lat; spot.lng = found.lng; spot.geoSource = 'auto';
                                p.lat = found.lat; p.lng = found.lng; p.status = 'approx';
                                this.drawMapPoints(pts, true);
                            } else {
                                p.status = 'fail';
                                this.mapFailedSpots.push(p.name);
                            }
                            this.mapStops = pts.slice();
                        }
                    } catch (e) {
                        console.error('renderMap error', e);
                        this.mapError = '地圖繪製時發生錯誤：' + e.message;
                    }
                    if (token === _mapRenderToken) { this.isMapLoading = false; this.mapProgress = ''; }
                },

                // --- Google Maps Native Routing Logic ---
                parsePlaceNameFromUrl(url) {
                    if (!url) return '';
                    let u = String(url);
                    try { u = decodeURIComponent(u); } catch (e) {}
                    const m = u.match(/\/maps\/place\/([^\/@?]+)/);
                    if (!m) return '';
                    const name = m[1].replace(/\+/g, ' ').trim();
                    if (/^-?\d+\.?\d*,\s*-?\d+\.?\d*$/.test(name)) return '';
                    return name;
                },
                looksLikeAddress(text) {
                    if (!text) return false;
                    return /\d/.test(text) && /[丁目番地号號〒市區区町村路街巷弄]|-|−/.test(text);
                },
                // 給 Google Maps 的每一站：只用「不會被誤認」的資訊
                getNavQuery(spot) {
                    // 1) 座標（完整網址 / 直接貼座標）→ 100% 準
                    const c = this.parseLatLngFromUrl(spot.googleMapUrl);
                    if (c) return `${c.lat},${c.lng}`;
                    // 2) 從 Google Maps App 分享的整段文字（店名＋地址）→ Google 自己的寫法，幾乎不會錯
                    const share = this.extractShareText(spot.googleMapUrl);
                    if (share) return share;
                    const J = (t) => this.toJapaneseKanji(t);
                    const name = (spot.name || '').trim();
                    const loc = (spot.location || '').trim();
                    const placeName = this.parsePlaceNameFromUrl(spot.googleMapUrl);
                    const city = (this.tripInfo.destination || '').trim();
                    // 3) 完整地址
                    if (this.looksLikeAddress(loc)) return J(placeName ? `${placeName} ${loc}` : `${name} ${loc}`);
                    // 4) 店名＋區域＋城市（日本行程自動轉成日文漢字）
                    const parts = [];
                    const add = (t) => { t = (t || '').trim(); if (t && !parts.some(p => p.includes(t) || t.includes(p))) parts.push(t); };
                    add(placeName || name);
                    add(loc);
                    add(city);
                    return J(parts.join(' '));
                },
                // 從完整 Google Maps 網址取出 Google 內部的「地點 ID」（!1s0x…:0x…）
                parseFeatureIdFromUrl(url) {
                    if (!url) return '';
                    let u = String(url);
                    try { u = decodeURIComponent(u); } catch (e) {}
                    const m = u.match(/!1s(0x[0-9a-f]+:0x[0-9a-f]+)/i);
                    return m ? m[1] : '';
                },
                // 每一站在路線網址中的寫法：
                // 有地點 ID → 路徑放店名、資料區放地點 ID＋座標，Google 會直接鎖定「那一家店」
                // （只給座標的話，Google 會把座標旁邊最近的店家/地址當成名稱，才會出現別家店名）
                getNavStop(spot) {
                    const c = this.parseLatLngFromUrl(spot.googleMapUrl);
                    const fid = this.parseFeatureIdFromUrl(spot.googleMapUrl);
                    const placeName = this.parsePlaceNameFromUrl(spot.googleMapUrl);
                    if (fid && c) {
                        return { seg: placeName || spot.name || `${c.lat},${c.lng}`, block: `!1m5!1m1!1s${fid}!2m2!1d${c.lng}!2d${c.lat}`, size: 6 };
                    }
                    if (placeName) return { seg: placeName, block: '!1m0', size: 1 };
                    if (c) return { seg: `${c.lat},${c.lng}`, block: '!1m0', size: 1 };
                    return { seg: this.getNavQuery(spot), block: '!1m0', size: 1 };
                },
                buildGoogleRouteUrl(spots) {
                    const stops = spots.map(s => this.getNavStop(s));
                    const enc = (t) => encodeURIComponent(t).replace(/%20/g, '+').replace(/%2C/gi, ',');
                    const path = stops.map(st => enc(st.seg)).join('/');
                    if (!stops.some(st => st.size > 1)) return `https://www.google.com/maps/dir/${path}`;
                    const inner = stops.reduce((n, st) => n + st.size, 0);
                    const data = `!4m${inner + 1}!4m${inner}` + stops.map(st => st.block).join('');
                    return `https://www.google.com/maps/dir/${path}/data=${data}`;
                },
                openGoogleMapsRoute() {
                    if (this.mapFilterDay === -1) {
                        alert("請先選擇特定的天數，才能開啟路線導航！");
                        return;
                    }
                    const spots = this.navSpotsForMapDay;
                    if (spots.length === 0) return;
                    window.open(this.buildGoogleRouteUrl(spots), '_blank');
                },
                openStopInGoogle(p) {
                    const spot = this.itinerary[p.dayIdx] && this.itinerary[p.dayIdx].spots[p.spotIdx];
                    if (!spot) return;
                    // 貼的是完整地點網址 → 直接打開原網址，保證是同一個地點
                    const url = this.extractMapUrl(spot.googleMapUrl);
                    if (url && this.parseFeatureIdFromUrl(url)) { window.open(url, '_blank'); return; }
                    const c = this.parseLatLngFromUrl(spot.googleMapUrl);
                    const q = c ? `${c.lat},${c.lng}` : this.getNavQuery(spot);
                    window.open(`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`, '_blank');
                },

                // --- Overview Timeline ---
                getDayPreviewSpots(day) {
                    return (day.spots || []).filter(s => s.type !== 'transit');
                },
                getDayPreviewSpotsLegacy(day) {
                    const list = (day.spots || []).filter(s => s.type !== 'transit');
                    // 今天：預覽的 3 個行程以「現在這個行程」為中心
                    const cur = this.currentSpotOf(day);
                    if (cur) {
                        const i = list.indexOf(cur);
                        if (i >= 3) { const st = Math.min(i - 1, list.length - 3); return list.slice(st, st + 3); }
                    }
                    return list.slice(0, 3);
                },
                // 依現在時間，找出「照行程現在應該在的地方」（只看今天）
                currentSpotOf(day) {
                    if (!this.isToday(day)) return null;
                    const now = new Date(this.nowTick);
                    const nowMin = now.getHours() * 60 + now.getMinutes();
                    const toMin = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
                    let best = null, bestStart = -1;
                    (day.spots || []).forEach(sp => {
                        if (sp.type === 'transit') return;
                        const st = toMin(sp.startTime || sp.checkInTime);
                        if (st != null && st <= nowMin && st >= bestStart) { best = sp; bestStart = st; }
                    });
                    return best;
                },
                isCurrentSpot(day, sp) {
                    return this.currentSpotOf(day) === sp;
                },
                inkOn(hex) { return inkOn(hex); },
                // ===== 雲端同步（Firebase） =====
                loadSyncSettings() {
                    try { const s = JSON.parse(localStorage.getItem('tripApp_sync') || 'null'); if (s && s.config && s.code) { this.sync.config = s.config; this.sync.code = s.code; this.sync.enabled = true; } } catch (e) {}
                    try { _syncLast = JSON.parse(localStorage.getItem('tripApp_syncLast') || '{}') || {}; } catch (e) { _syncLast = {}; }
                    let dev = localStorage.getItem('tripApp_device');
                    if (!dev) { dev = 'd' + Math.random().toString(36).slice(2, 10); try { localStorage.setItem('tripApp_device', dev); } catch (e) {} }
                    this.sync.deviceId = dev;
                },
                saveSyncSettings() {
                    try {
                        if (this.sync.enabled) localStorage.setItem('tripApp_sync', JSON.stringify({ config: this.sync.config, code: this.sync.code }));
                        else localStorage.removeItem('tripApp_sync');
                        localStorage.setItem('tripApp_syncLast', JSON.stringify(_syncLast || {}));
                    } catch (e) {}
                },
                // 從 Firebase 主控台複製的那一段設定文字解析出來
                parseFirebaseConfig(text) {
                    const t = String(text || '');
                    const cfg = {};
                    const re = /(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId|measurementId)\s*[:=]\s*["']([^"']+)["']/g;
                    let m; while ((m = re.exec(t))) cfg[m[1]] = m[2];
                    if (!cfg.apiKey || !cfg.projectId || !cfg.appId) return null;
                    return cfg;
                },
                async loadFirebaseSdk() {
                    const v = '10.12.2';
                    await this.loadScriptOnce(`https://www.gstatic.com/firebasejs/${v}/firebase-app-compat.js`, 15000);
                    await this.loadScriptOnce(`https://www.gstatic.com/firebasejs/${v}/firebase-auth-compat.js`, 15000);
                    await this.loadScriptOnce(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore-compat.js`, 15000);
                    return window.firebase;
                },
                async connectSync() {
                    if (!this.sync.enabled || !this.sync.config || !this.sync.code) return false;
                    this.sync.status = 'connecting'; this.sync.error = '';
                    try {
                        const fb = await this.loadFirebaseSdk();
                        if (!_fbApp) _fbApp = fb.apps.find(a => a.name === 'tripSync') || fb.initializeApp(this.sync.config, 'tripSync');
                        await _fbApp.auth().signInAnonymously();
                        _fbDb = _fbApp.firestore();
                        _fbRef = _fbDb.collection('trips').doc(this.sync.code);
                        if (_fbUnsub) _fbUnsub();
                        _fbUnsub = _fbRef.onSnapshot(snap => {
                            if (!snap.exists || snap.metadata.hasPendingWrites) return;
                            const d = snap.data();
                            this.sync.status = 'online'; this.sync.lastAt = Date.now();
                            this.receiveRemote({ items: d.items || {}, tomb: d.tomb || {} });
                        }, err => { this.sync.status = 'error'; this.sync.error = this.syncErrorText(err); });
                        this.sync.status = 'online';
                        return true;
                    } catch (e) {
                        console.error(e);
                        this.sync.status = 'error'; this.sync.error = this.syncErrorText(e);
                        return false;
                    }
                },
                syncErrorText(e) {
                    const c = (e && (e.code || e.message)) || '';
                    if (/permission/i.test(c)) return '沒有權限：請確認 Firestore「規則」已照教學貼上並發布';
                    if (/operation-not-allowed|admin-restricted/i.test(c)) return '請到 Firebase 的 Authentication 開啟「匿名」登入';
                    if (/api-key|invalid-api-key/i.test(c)) return '設定文字有誤，請重新複製 firebaseConfig';
                    if (/unavailable|network|offline|timeout|load failed/i.test(c)) return '目前沒有網路，恢復連線後會自動同步';
                    return '同步失敗：' + c;
                },
                // 別人改了 → 合併進來（這台手機還沒送出的修改會保留）
                receiveRemote(remote) {
                    if (this.sync.joining) return;
                    if (this.showSpotModal || this.isDraggingSpot || this.appState !== 'main') { _syncPendingRemote = remote; return; }
                    _syncPendingRemote = null;
                    const last = _syncLast || {}, ri = remote.items || {};
                    const same = Object.keys(ri).length === Object.keys(last).length && Object.keys(ri).every(k => last[k] && last[k].d === ri[k].d && last[k].u === ri[k].u);
                    if (same) return;   // 自己剛送出的內容，不用重畫
                    const now = Date.now();
                    const localDiff = syncDiff(syncItemsFromState(this.syncStateSnapshot()), _syncLast || {}, now);
                    const merged = syncMerge(remote, localDiff);
                    this.applySyncDoc(merged);
                    _syncLast = JSON.parse(JSON.stringify(remote.items || {}));
                    this.saveSyncSettings();
                    if (Object.keys(localDiff.changed).length || Object.keys(localDiff.tomb).length) this.schedulePush(300);
                },
                syncStateSnapshot() {
                    return { tripInfo: this.tripInfo, itinerary: this.itinerary, todoCategories: this.todoCategories, customPayers: this.customPayers,
                             customCostCategories: this.customCostCategories, customPaymentMethods: this.customPaymentMethods, customTransits: this.customTransits };
                },
                applySyncDoc(doc) {
                    const b = syncBuildState(doc, this.syncStateSnapshot());
                    if (!b.days.length && !Object.keys(doc.items || {}).length) return;
                    this.isApplyingRemote = true;
                    if (b.tripInfo) { this.tripInfo = Object.assign({}, this.tripInfo, b.tripInfo); this.migrateFlights(); }
                    const plan = { newDates: b.days.map(d => d.rawDate), result: b.days.map(d => Object.assign(this.makeEmptyDay(), { hero: d.hero || this.makeEmptyDay().hero, customSorted: d.customSorted, spots: d.spots })) };
                    if (plan.result.length) this.applyItineraryPlan(plan);
                    if (b.lists) {
                        ['customPayers', 'customCostCategories', 'customPaymentMethods', 'customTransits'].forEach(k => { if (Array.isArray(b.lists[k])) this[k] = b.lists[k]; });
                    }
                    if (b.todoCategories && b.todoCategories.length) this.todoCategories = b.todoCategories;
                    this.isGenerated = true;
                    if (this.appState === 'setup' && !this.isEditing) this.appState = 'main';
                    this.$nextTick(() => {
                        this.isApplyingRemote = false;
                        if (this.currentTab === 'itinerary') this.initSortableItinerary();
                        if (this.currentTab === 'todo') this.initSortableTodo();
                    });
                },
                schedulePush(delay) {
                    if (!this.sync.enabled || this.isApplyingRemote) return;
                    clearTimeout(_syncTimer);
                    _syncTimer = setTimeout(() => this.pushSync(), delay == null ? 1200 : delay);
                },
                async pushSync() {
                    if (!this.sync.enabled) return;
                    if (!_fbRef) { const ok = await this.connectSync(); if (!ok) return; }
                    if (this.sync.joining) return;
                    const diff = syncDiff(syncItemsFromState(this.syncStateSnapshot()), _syncLast || {}, Date.now());
                    if (!Object.keys(diff.changed).length && !Object.keys(diff.tomb).length) return;
                    this.sync.status = 'syncing';
                    try {
                        let merged = null;
                        await _fbDb.runTransaction(async tx => {
                            const snap = await tx.get(_fbRef);
                            const remote = snap.exists ? { items: snap.data().items || {}, tomb: snap.data().tomb || {} } : null;
                            merged = syncMerge(remote, diff);
                            if (JSON.stringify(merged).length > 950000) throw new Error('資料量太大，超過雲端單筆上限');
                            tx.set(_fbRef, { items: merged.items, tomb: merged.tomb, name: this.tripInfo.tripName || '', updatedAt: Date.now(), updatedBy: this.sync.deviceId });
                        });
                        _syncLast = JSON.parse(JSON.stringify(merged.items));
                        this.saveSyncSettings();
                        this.sync.status = 'online'; this.sync.lastAt = Date.now(); this.sync.error = '';
                        // 合併時如果拿到旅伴的新內容，更新到畫面
                        const localNow = syncItemsFromState(this.syncStateSnapshot());
                        if (Object.keys(merged.items).some(k => localNow[k] !== merged.items[k].d) || Object.keys(localNow).some(k => !merged.items[k])) this.applySyncDoc(merged);
                    } catch (e) {
                        console.error(e);
                        this.sync.status = 'error'; this.sync.error = this.syncErrorText(e);
                        clearTimeout(_syncTimer); _syncTimer = setTimeout(() => this.pushSync(), 30000);
                    }
                },

                formatTimeTyping(v) {
                    v = String(v || '').replace(/[：.．]/g, ':').replace(/[^\d:]/g, '');
                    if (v.includes(':')) {
                        const [h, ...rest] = v.split(':');
                        return h.slice(0, 2) + ':' + rest.join('').slice(0, 2);

                    let d = v.slice(0, 4);
                    if (d.length >= 1 && d[0] > '2') d = ('0' + d).slice(0, 4);   // 輸入 9 → 09

                normalizeTime(v) {

                        const d = v.replace(/\D/g, '');
                        if (d.length <= 2) { h = parseInt(d, 10); m = 0; }
                        else if (d.length === 3) { h = parseInt(d[0], 10); m = parseInt(d.slice(1), 10); }

                    if (isNaN(h) || isNaN(m) || h > 23 || m > 59) {
                        alert('時間格式請輸入 00:00 ~ 23:59，例如 15:00');

                calculateDuration(start, end) {
                    if(!start || !end) return '';
                    let [sh, sm] = start.split(':').map(Number);
                    let [eh, em] = end.split(':').map(Number);
                    let totalMin = (eh * 60 + em) - (sh * 60 + sm);
                    if(totalMin < 0) totalMin += 24 * 60;
                    let h = Math.floor(totalMin / 60); let m = totalMin % 60;
                    if(h > 0 && m > 0) return `${h}hr ${m}min`;

                    if (spot.startTime && spot.endTime) return this.calculateDuration(spot.startTime, spot.endTime);

                        this[target.arr].push(target.val.trim());

                        if (type === 'transit') this.setTransitMethod(target.val.trim());

                submitSpot() {
                    if(!this.selectedSpot.name) return alert('請輸入行程名稱！');
                    // 有打字但忘了按「＋」的連結、標籤，存檔時一併加入

                    if (this.selectedSpot.transitMethod === '自訂') this.selectedSpot.transitMethod = this.tempCustomTransit.trim() || '地鐵';
                    // 鐵道：同步第一段/最後一段到舊欄位（匯出等功能會用到）
                    if (this.selectedSpot.type === 'transit' && this.transitKind(this.selectedSpot.transitMethod) === 'rail') {
                        const legs = (this.selectedSpot.legs || []).filter(l => l.from || l.to || l.line || l.note);
                        this.selectedSpot.legs = legs.length ? legs : [this.blankLeg('')];
                        if (legs.length) { this.selectedSpot.depAirport = legs[0].from; this.selectedSpot.arrAirport = legs[legs.length - 1].to; }
                    }
                    if (this.selectedSpot.seats) this.selectedSpot.seats = this.selectedSpot.seats.filter((x, i) => x.name || x.seat || i === 0);
                    this.selectedSpot.checklist = this.sortChecklist((this.selectedSpot.checklist || []).filter(x => (x.text || '').trim()));
                    if (this.selectedSpot.isAdvance) {
                        if (!this.selectedSpot.payer || this.selectedSpot.payer === '自訂') return alert('有勾選「墊付」，請先選擇付款人（先付錢的人）');
                        this.selectedSpot.advances = (this.selectedSpot.advances || []).filter(a => a.person && a.person !== this.selectedSpot.payer && parseFloat(a.amount) > 0);
                        if (!this.selectedSpot.advances.length) this.selectedSpot.isAdvance = false;
                    }
                    this.selectedSpot.tags = this.selectedSpot.checklist.map(x => ({ type: x.kind, text: x.text }));   // 舊欄位同步（匯出用）
                    delete this.selectedSpot.buyList;
                    if (this.selectedSpot.type === 'konbini') {
                        const tot = this.checklistTotal(this.selectedSpot);
                        if (tot && !Number(this.selectedSpot.cost)) { this.selectedSpot.cost = tot; this.selectedSpot.currency = 'JPY'; }
                    }
                    if (this.selectedSpot.type === 'hotel' && this.selectedSpot.checkInDate && this.selectedSpot.checkOutDate && this.selectedSpot.checkOutDate <= this.selectedSpot.checkInDate) {
                        return alert('退房日期要晚於入住日期喔！');

                    const origSpot = this.spotModalMode === 'edit' ? this.itinerary[this.activeDay].spots[this.selectedSpotIndex] : null;

                    let origUrl = origSpot ? origSpot.googleMapUrl : null;

                        this.selectedSpot.lat = null; this.selectedSpot.lng = null; this.selectedSpot.geoSource = '';

                    if(!this.selectedSpot.id) this.selectedSpot.id = this.makeSpotId();
                    if(this.spotModalMode === 'add') {

                        if(!this.hasCustomOrder(this.activeDay)) this.autoSortCurrentDay();

                },
                removeTag(type, text) {

                    let url = this.newLinkUrl.trim();

                    if (!/^https?:\/\//i.test(url)) url = 'https://' + url;
                    let title = this.newLinkTitle.trim();
                    if (!title) { try { title = new URL(url).hostname.replace(/^www\./, ''); } catch (e) { title = url; } }
                    if (!this.selectedSpot.links) this.selectedSpot.links = [];

                handleImageUpload(event) {

                    Array.from(files).forEach(file => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            const img = new Image();
                            img.onload = () => {
                                const canvas = document.createElement('canvas'); let width = img.width, height = img.height;
                                if (width > 600) { height = Math.round((height * 600) / width); width = 600; }
                                canvas.width = width; canvas.height = height; canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                                const compressedData = canvas.toDataURL('image/jpeg', 0.6);
                                this.selectedSpot.images.push({ url: compressedData, pos: 50, desc: '' });
                                if(!this.selectedSpot.coverImage) {
                                    this.selectedSpot.coverImage = compressedData;
                                    this.selectedSpot.coverPosition = 50;
                                }
                            }; img.src = e.target.result;
                        }; reader.readAsDataURL(file);
                    });
                },

                    Array.from(files).forEach(file => {

                            spots: []
                        };
                        
                        if(dayCount === 1) {
                            let defaultPayer = this.customPayers.length > 0 ? this.customPayers[0] : '';

                                { checkInTime: '15:00', type: 'hotel', name: '大塚 OMO5', location: '豐島區北大塚', cost: 25000, currency: 'JPY', costCategory: '住宿', payer: defaultPayer, paymentMethod: '信用卡', warning: '15:00 才能 Check-in', checkInDate: this.toYMD(current), checkOutDate: this.addDaysYMD(this.toYMD(current), 2) },

                copyToMarkdown() {
                    let md = `# ${this.tripInfo.tripName || '我的旅程'}\n`;
                    md += `> 📍 **目的地**: ${this.tripInfo.destination}, ${this.englishDestination}\n`;
                    md += `> 📅 **日期**: ${this.tripInfo.startDate} - ${this.tripInfo.endDate} (${this.calculatedDays}天${this.calculatedNights}夜)\n\n`;
                    
                    md += `---\n\n## 🗺️ 每日行程表\n\n`;
                    this.itinerary.forEach(day => {
                        md += `### ${day.label} (${day.shortDate})\n`;
                        if(day.hero.location) md += `**重點行程**：${day.hero.title} @ ${day.hero.location}\n\n`;
                        if(day.spots) {
                            day.spots.forEach(spot => {
                                let durStr = this.getDurationDisplay(spot);
                                let timeStr = this.getTimelineMainText(spot);
                                md += `- **${timeStr} | ${spot.name}** [${this.getSpotTypeName(spot.type)}] ${durStr ? '('+durStr+')' : ''}\n`;
                                if(spot.cost) md += `  - 💰 花費：${spot.currency === 'JPY' ? 'JPY ¥' : 'NTD $'} ${this.formatCurrency(spot.cost)} (由 ${spot.payer} 以 ${spot.paymentMethod} 支付)\n`;
                                if(spot.location) md += `  - 📍 地點：${spot.location}\n`;
                                if(spot.googleMapUrl) md += `  - 🗺️ 導航：${spot.googleMapUrl}\n`;
                                if(spot.warning) md += `  - ⚠️ 注意：${spot.warning}\n`;
                                if(spot.desc) md += `  - 📝 筆記：${spot.desc.replace(/\n/g, ' ')}\n`;
                                if(spot.tags && spot.tags.length) {
                                    (spot.checklist && spot.checklist.length ? spot.checklist.map(c => ({ type: c.kind, text: c.text + (c.done ? ' ✅' : '') })) : spot.tags).forEach(t => md += `  - ${t.type}：${t.text}\n`);
                                }
                                if(spot.links && spot.links.length) {
                                    spot.links.forEach(l => md += `  - 🔗 [${l.title}](${l.url})\n`);
                                }
                            });
                        }
                        md += `\n`;
                    });

                    navigator.clipboard.writeText(md).then(() => alert('已成功複製 Markdown！您可以直接貼上至 Notion 了！')).catch(() => alert('複製失敗，請稍後再試。'));
                },

        // ===== 雲端同步（Firebase）核心：把行程拆成一筆一筆，各自記「最後修改時間」，兩邊同時改也能合併 =====
        const SYNC_MEDIA_KEYS = ['images', 'files', 'coverImage'];
        function syncStripSpot(sp) {
            const o = {};
            Object.keys(sp).forEach(k => { if (!SYNC_MEDIA_KEYS.includes(k) && k !== '_u') o[k] = sp[k]; });
            return o;
        }
        // 把目前的行程變成 { 鍵: 內容字串 }
        function syncItemsFromState(st) {
            const items = {};
            items['trip'] = JSON.stringify(st.tripInfo || {});
            items['lists'] = JSON.stringify({ customPayers: st.customPayers || [], customCostCategories: st.customCostCategories || [], customPaymentMethods: st.customPaymentMethods || [], customTransits: st.customTransits || [] });
            (st.itinerary || []).forEach(day => {
                const key = day.rawDate || day.label;
                const hero = day.hero ? Object.assign({}, day.hero) : null;
                if (hero && /^data:/.test(hero.image || '')) hero.image = '';   // 自己上傳的封面照片留在本機
                items['day:' + key] = JSON.stringify({ hero, customSorted: !!day.customSorted, order: (day.spots || []).map(s => s.id) });
                (day.spots || []).forEach(sp => { if (sp.id) items['spot:' + sp.id] = JSON.stringify(Object.assign(syncStripSpot(sp), { __day: key })); });
            });
            (st.todoCategories || []).forEach(c => {
                const cc = JSON.parse(JSON.stringify(c));
                (cc.subcategories || []).forEach(sub => { delete sub.newItemText; });   // 正在打字的草稿不同步
                items['todo:' + c.id] = JSON.stringify(cc);
            });
            items['todoOrder'] = JSON.stringify((st.todoCategories || []).map(c => c.id));
            return items;
        }
        // 跟上次同步的內容比對：有變的才蓋新時間戳；不見的記成刪除
        function syncDiff(items, last, now) {
            const changed = {}, tomb = {};
            Object.keys(items).forEach(k => { if (!last[k] || last[k].d !== items[k]) changed[k] = { d: items[k], u: now }; });
            Object.keys(last).forEach(k => { if (!(k in items)) tomb[k] = now; });
            return { changed, tomb };
        }
        // 合併：同一筆取時間比較新的；刪除比內容新就刪掉
        function syncMerge(remote, local) {
            const R = remote || { items: {}, tomb: {} };
            const items = Object.assign({}, R.items || {});
            const tomb = Object.assign({}, R.tomb || {});
            Object.keys(local.tomb || {}).forEach(k => { if (!tomb[k] || tomb[k] < local.tomb[k]) tomb[k] = local.tomb[k]; });
            Object.keys(local.changed || {}).forEach(k => { const r = items[k]; if (!r || r.u <= local.changed[k].u) items[k] = local.changed[k]; });
            Object.keys(tomb).forEach(k => { if (items[k] && items[k].u <= tomb[k]) delete items[k]; });
            // 時間很久的刪除紀錄清掉，避免越存越大（30 天）
            const cutoff = Date.now() - 30 * 86400000;
            Object.keys(tomb).forEach(k => { if (tomb[k] < cutoff && !items[k]) delete tomb[k]; });
            return { items, tomb };
        }
        // 由合併後的資料重建行程；照片與附件沿用這台手機原本的
        function syncBuildState(doc, localState) {
            const items = doc.items || {};
            const get = (k) => { try { return items[k] ? JSON.parse(items[k].d) : null; } catch (e) { return null; } };
            const media = {};
            (localState.itinerary || []).forEach(d => (d.spots || []).forEach(sp => {
                if (sp.id) { const m = {}; SYNC_MEDIA_KEYS.forEach(k => { if (sp[k] != null) m[k] = sp[k]; }); media[sp.id] = m; }
            }));
            const tripInfo = get('trip') || localState.tripInfo;
            const lists = get('lists') || {};
            const spotsByDay = {};
            Object.keys(items).forEach(k => {
                if (!k.startsWith('spot:')) return;
                const sp = get(k); if (!sp) return;
                const dayKey = sp.__day; delete sp.__day;
                Object.assign(sp, { images: [], files: [], coverImage: '' }, media[sp.id] || {});
                (spotsByDay[dayKey] = spotsByDay[dayKey] || []).push(sp);
            });
            const dayKeys = Object.keys(items).filter(k => k.startsWith('day:')).map(k => k.slice(4));
            Object.keys(spotsByDay).forEach(k => { if (!dayKeys.includes(k)) dayKeys.push(k); });
            dayKeys.sort();
            const localHero = {};
            (localState.itinerary || []).forEach(d => { if (d.hero && /^data:/.test(d.hero.image || '')) localHero[d.rawDate || d.label] = d.hero.image; });
            const days = dayKeys.map(key => {
                const meta = get('day:' + key) || {};
                if (meta.hero && !meta.hero.image && localHero[key]) meta.hero.image = localHero[key];
                const list = spotsByDay[key] || [];
                const order = meta.order || [];
                list.sort((a, b) => {
                    const ia = order.indexOf(a.id), ib = order.indexOf(b.id);
                    if (ia >= 0 && ib >= 0) return ia - ib;
                    if (ia >= 0) return -1; if (ib >= 0) return 1;
                    return String(a.startTime || '99').localeCompare(String(b.startTime || '99'));
                });
                return { rawDate: key, hero: meta.hero, customSorted: !!meta.customSorted, spots: list };
            });

            const todos = Object.keys(items).filter(k => k.startsWith('todo:')).map(k => get(k)).filter(Boolean);
            todos.sort((a, b) => { const ia = todoOrder.indexOf(a.id), ib = todoOrder.indexOf(b.id); return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib); });

        // 飛行時間（自動換算兩地時差）
        function flightTiming(depCode, arrCode, depTime, arrTime) {
            const toMin = (t) => { const m = /^(\d{1,2}):(\d{2})$/.exec(t || ''); return m ? Number(m[1]) * 60 + Number(m[2]) : null; };
            const dep = toMin(depTime), arr = toMin(arrTime);
            if (dep == null || arr == null) return { minutes: null, dayOffset: 0 };
            const tz = (c) => { const a = AIRPORTS[(c || '').trim().toUpperCase()]; return a ? a[1] : null; };

            if (dTz == null || aTz == null) { dTz = 0; aTz = 0; }

        function ticketTexts(flight, passenger) {
            const f = flight || {};
            const ap = (c) => AIRPORTS[(c || '').trim().toUpperCase()];
            let ymd = '', wk = '';
            if (f.date) { const [y, m, d] = f.date.split('-').map(Number); ymd = `${y}/${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}`; wk = WEEK_ZH[new Date(y, m - 1, d).getDay()]; }
            const code = (c) => (c || '---').toUpperCase();
            const dash = (v) => v || '—';
            return {
                airline: (f.airline || 'BON VOYAGE').toUpperCase(), airlineSub: (f.airline && AIRLINES_EN[f.airline.trim()]) || 'Have a good trip',
                date: ymd ? `${ymd} (${wk})` : '', depCode: code(f.depCode), arrCode: code(f.arrCode),
                depZh: ap(f.depCode) ? ap(f.depCode)[0] : '', depEn: ap(f.depCode) ? ap(f.depCode)[2] : '',
                arrZh: ap(f.arrCode) ? ap(f.arrCode)[0] : '', arrEn: ap(f.arrCode) ? ap(f.arrCode)[2] : '',
                passenger: dash(passenger), seat: dash(f.seat), cabin: dash(f.cabin), boarding: dash(f.boardingTime), gate: dash(f.gate), bag: dash(f.baggage), pnr: dash(f.bookingRef),
                sDep: code(f.depCode), sArr: code(f.arrCode), sPassenger: dash(passenger), sFlight: dash(f.flightNo).toUpperCase(), sDate: ymd || '—', sWeek: wk ? `(${wk})` : '',
                sSeat: dash(f.seat), sCabin: dash(f.cabin), sBoarding: dash(f.boardingTime), sGate: dash(f.gate)
            };
        }
        let _ticketImg = null;
        function loadTicketImage() {
            if (_ticketImg) return Promise.resolve(_ticketImg);
            return new Promise((res, rej) => { const im = new Image(); im.onload = () => { _ticketImg = im; res(im); }; im.onerror = rej; im.src = TICKET_BG; });
        }
        // 用與畫面相同的座標，把登機證畫成圖片
        async function drawTicket(ctx, ox, oy, scale, flight, passenger, withShadow) {
            const img = await loadTicketImage();
            ctx.save();
            if (withShadow) { ctx.shadowColor = 'rgba(15,23,42,0.12)'; ctx.shadowBlur = 30 * scale / 2; ctx.shadowOffsetY = 12 * scale / 2; }
            ctx.drawImage(img, ox, oy, 1724 * scale, 794 * scale);
            ctx.restore();
            const T = ticketTexts(flight, passenger);
            TICKET_LAYOUT.forEach(it => {
                let text = String(T[it.k] || '');
                if (!text) return;
                if (it.up) text = text.toUpperCase();
                const px = it.px * scale;
                ctx.font = `${it.w} ${px}px ${it.f === 'serif' ? '"Playfair Display", "Noto Serif TC", serif' : '"Noto Sans TC", sans-serif'}`;
                ctx.fillStyle = it.c; ctx.textBaseline = 'alphabetic';
                const ls = it.ls * px;
                const widthOf = (t) => Array.from(t).reduce((w, ch) => w + ctx.measureText(ch).width + ls, 0) - ls;
                const maxW = it.mw ? it.mw * scale : 0;
                if (maxW && widthOf(text) > maxW) {
                    let chars = Array.from(text);
                    while (chars.length > 1 && widthOf(chars.join('') + '…') > maxW) chars.pop();
                    text = chars.join('') + '…';
                }
                const total = widthOf(text);
                let x = it.r != null ? ox + (it.r - 26) * scale - total : ox + (it.x - 26) * scale;
                const y = oy + (it.b - 55) * scale;
                Array.from(text).forEach(ch => { ctx.fillText(ch, x, y); x += ctx.measureText(ch).width + ls; });
            });
        }
        const BoardingPass = {
            props: ['flight', 'dir', 'passenger', 'year'],
            template: '#boarding-pass-tpl',
            data() { return { bg: TICKET_BG }; },
            computed: {
                parts() {
                    const v = this.flight && this.flight.date;
                    if (!v) return null;
                    const [y, m, d] = v.split('-').map(Number);
                    return { ymd: `${y}/${String(m).padStart(2, '0')}/${String(d).padStart(2, '0')}`, w: WEEK_ZH[new Date(y, m - 1, d).getDay()] };
                },
                dateLabel() { return this.parts ? `${this.parts.ymd} (${this.parts.w})` : ''; },
                stubDate() { return this.parts ? this.parts.ymd : ''; },
                stubWeek() { return this.parts ? `(${this.parts.w})` : ''; },
                airlineTitle() { return ((this.flight && this.flight.airline) || 'BON VOYAGE').toUpperCase(); },
                airlineSub() {
                    const a = this.flight && this.flight.airline;
                    return (a && AIRLINES_EN[a.trim()]) || 'Have a good trip';
                }
            },
            methods: {
                code(c) { return (c || '---').toUpperCase(); },

                enName(c) { const a = AIRPORTS[(c || '').trim().toUpperCase()]; return a ? a[2] : ''; }
            }
        };
